media: {space: {type: em}}
sources:
  A: {on: space, at: [1000 m, 0 m], velocity: ["-0.6*299792458[m/s]", 0 m/s], f: 1 GHz, A: 1, phase: 0, spreading: none}
  S: {on: space, at: [1000 m, 0 m], f: 1 GHz, A: 1, phase: 0, spreading: none}
  Z: {on: space, at: [0 m, 0 m], f: 1 GHz, A: 1, phase: 0, spreading: spherical, A_at: 1 m}
  W: {on: space, at: [0 m, 0 m], f: 1 GHz, power: 10 W, phase: 0, spreading: spherical}
points:
  O: [0 m, 0 m]
  P: {at: [0 m, 0 m], velocity: ["0.6*299792458[m/s]", 0 m/s]}
  far: [10 m, 0 m]
rays: {app: {from: A, to: O}, q: {from: S, to: P}, st: {from: S, to: O}, z: {from: Z, to: far}, w: {from: W, to: far}}
observe:
  wl_src_moving: "wavelength(app, emitted=0[s])"
  wl_listener_moving: "wavelength(q, emitted=0[s])"
  fq: "frequency(q, emitted=0[s])"
  beat: "beat_frequency(app, st, t=1e-5[s])"
  inten: "intensity(w)"
  inten2: "intensity(z)"
  pa: "pressure_amplitude(z)"
  lvl: "sound_level(intensity(w))"
  wl_static: "wavelength(st)"
  ph: "phase(z)"
  amp: "amplitude(z)"
