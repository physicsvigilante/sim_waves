symbols: {q: real, p: positive, a: positive, b: positive}
observe:
  t1: "abs(q) >= 0"
  u1: "abs(q) > 0"
  t2: "abs(q-1) + abs(q+1) >= 2"
  u2: "abs(q-1) + abs(q+1) > 2"
  t3: "abs(a - b) < a + b"
  t4: "max(a, b) >= a"
  u4: "max(a, b) > min(a, b)"
  t5: "abs(p - 1) + p > 0.5"
  u5: "abs(p - 1) + p > 1"
  u6: "abs(abs(q) - 1) <= 1"
  t6: "abs(abs(q) - 1) + abs(q) >= 1"
  u7: "abs(p - 1) + abs(p) > 1"
  f8: "abs(q) < -1"
  f9: "abs(p - 1) + p < 1"
  t10: "max(p, 2) >= 2"
  u10: "max(p, 2) > 2"
  t11: "min(p, 2) <= 2"
  f11: "min(q, 2) > 2"
  t12: "abs(q - 1) + abs(q - 3) >= 2"
  u13: "abs(q*q - 1) >= q*q - 1"
  t14: "max(abs(q), 1) >= 1"
  u15: "abs(a - 2*b) < a + b"
  u16: "abs(sin(q)) <= 1"
  u17: "abs(q - 1) >= abs(q) - 1"
  t18: "0 < abs(p - 1) + 1 < p + 3"
  u19: "abs(q) == abs(-q)"
  u20: "abs(p-1) <= max(p, 1)"
