id: m9/R1
answer: 2
solution:
  - "Longitudinal wave speed in the rod is v = sqrt(Y/rho); it is the same in both arrangements (same rod)."
  - "Free ends are displacement antinodes; the clamp point is a displacement node."
  - "Free-free rod modes: displacement u_n(x) proportional to cos(n*pi*x/L), frequency f_n = n v/(2L), n = 1, 2, 3, ..."
  - "Clamp at x = L/2 needs cos(n*pi/2) = 0, i.e. n odd; lowest is n = 1, so f_a = v/(2L)."
  - "Clamp at x = L/4 needs cos(n*pi/4) = 0, i.e. n = 2, 6, 10, ...; lowest is n = 2, so f_b = 2v/(2L) = v/L."
  - "Check: the segment from the near free end to the clamp is L/4 = lambda/4 with lambda = L; the other segment is 3L/4 = 3 lambda/4, an odd multiple of lambda/4, consistent."
  - "f_b / f_a = (v/L)/(v/(2L)) = 2, independent of L, Y and rho."
verification:
  - "Method 1: closed-form ratio evaluated with three random (Y, rho, L) sets -> 2.0 each."
  - "Method 2: brute-force search of free-free mode list for the first mode with a node at the clamp, random L and v -> 2.0 each."
conventions_used:
  - "Clamp treated as an ideal point node; ends free (antinodes)."
  - "Thin-rod longitudinal speed v = sqrt(Y/rho); no lateral (Poisson) corrections."
