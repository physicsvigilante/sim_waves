id: m9/R2
answer: [A, C]
solution:
  - "Closed tube fundamental: f1 = v/(4L) = 340/(4L) = 85/L Hz."
  - "With L > 0.40 m, f1 < 85/0.40 = 212.5 Hz < 250 Hz, so the fork is always higher; difference = 250 - 85/L Hz. A is correct."
  - "Shortening the tube raises f1 = 85/L toward (but, for a slight change, still below) 250 Hz, so the difference 250 - 85/L decreases. B is incorrect."
  - "First overtone of a closed tube is the 3rd harmonic: 3v/(4L) = 255/L Hz. With L > 0.40 m this is only bounded by 255/L < 637.5 Hz; it exceeds 250 Hz when L < 1.02 m and is below 250 Hz when L > 1.02 m. Both are allowed, so its position relative to 250 Hz is undecidable. C is correct."
  - "Open-open tube of length L: fundamental v/(2L) = 170/L Hz < 425 Hz; it exceeds 250 Hz only if L < 0.68 m, which is not guaranteed. D is incorrect."
verification:
  - "Method 1: dense numerical sampling of L in (0.40, 20] m checking each statement over the whole allowed range: A true, B false, C true (both signs occur), D false."
  - "Method 2: analytic crossing points: sup f1 = 212.5 Hz; overtone crosses 250 Hz at L = 1.02 m; open-tube fundamental crosses 250 Hz at L = 0.68 m, both inside the allowed range."
conventions_used:
  - "First overtone of a closed tube = third harmonic (next allowed mode above the fundamental)."
  - "No end correction; v = 340 m/s fixed."
  - "'Difference' means fork frequency minus tube frequency in magnitude; the sign is fixed by the bound."
