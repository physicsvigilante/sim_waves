id: m9/R3
answer: 74.2
tolerance: 0.1
solution:
  - "Point source: I = P/(4 pi r^2). Write a = P_A/(4 pi), b = P_B/(4 pi) (both unknown)."
  - "Incoherent sources: intensities add. I_P = a/4 + b/16, I_Q = a/16 + b/4 (in W/m^2, r in m)."
  - "From levels: I_P = 1e-12 * 10^8 = 1.0e-4 W/m^2; I_Q = 1e-12 * 10^7.5 = 3.162e-5 W/m^2."
  - "Multiply by 16: 4a + b = 1.6e-3; a + 4b = 5.060e-4."
  - "Solve: a = (4*1.6e-3 - 5.060e-4)/15 = 3.929e-4 W; b = 1.6e-3 - 4a = 2.83e-5 W (both positive, so physical)."
  - "At R: I_R = (a + b)/16 = 4.212e-4/16 = 2.632e-5 W/m^2."
  - "L_R = 10 log10(2.632e-5 / 1e-12) = 74.2 dB."
verification:
  - "Method 1: linear solve of the 2x2 intensity system with numpy -> L_R = 74.204 dB."
  - "Method 2: fixed-point iteration directly on the source powers until both meter readings reproduce 80.0 and 75.0 dB -> L_R = 74.204 dB."
conventions_used:
  - "L = 10 log10(I/I0), I0 = 1e-12 W/m^2."
  - "Incoherent sources: intensities (not amplitudes) add."
  - "Inverse-square spreading, no absorption or reflection; 5.0 m separation only fixes that the geometry is realisable."
