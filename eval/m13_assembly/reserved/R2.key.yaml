solution: |
  T = Y A dL / L0 = 2e11 * 1e-6 * 4e-4 / 1.0 = 80 N.
  mu = rho A = 8000 * 1e-6 = 8e-3 kg/m.
  v = sqrt(T/mu) = sqrt(80/8e-3) = sqrt(1e4) = 100 m/s.
  f1 = v/(2L) = 100/2 = 50 Hz;  period = 1/f1 = 0.02 s = 20 ms.
