id: R1
answer: 84   # Hz
solution: |
  Block volume V = M/rho_b = 10/2500 = 4e-3 m^3.
  In air: T_a = M g = 100 N; v = sqrt(T/mu) = sqrt(100/0.01) = 100 m/s;
          f_a = v/(2L) = 100/(2*0.5) = 100 Hz.
  Immersed: buoyancy = rho_oil V g = 900*4e-3*10 = 36 N; T_w = 64 N;
          v = 80 m/s; f_w = 80 Hz  (equivalently f_w = f_a*sqrt(1 - rho_oil/rho_b) = 100*0.8).
  Fork: |F - 100| = 16 -> F in {84, 116};  |F - 80| = 4 -> F in {76, 84}.
  Common value: F = 84 Hz.
checks:
  - method: formula ratio
    detail: f_w/f_a = sqrt(1 - 900/2500) = sqrt(0.64) = 0.8 -> f_w = 80 Hz; intersection gives 84 Hz.
  - method: python (device)
    detail: |
      V=M/rb; fa=sqrt(M*g/mu)/(2L)=100.0; fw=sqrt((M*g-rf*V*g)/mu)/(2L)=80.0;
      {fa±16} ∩ {fw±4} = {84.0}
engine_features: [tension.weight, tension.buoyancy (fluid_density + load_density, fraction 1), beats]
