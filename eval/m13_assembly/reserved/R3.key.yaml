id: R3
answer: [A, B, D]
solution: |
  Closed pipe: f_n = (2n-1) v/(4L), fundamental v/(4L) = 330/(4*0.55) = 150 Hz.
  Allowed: 150, 450, 750, 1050, 1350, ... Hz (odd harmonics only).
  In [300, 1200] Hz: 450, 750, 1050 Hz -> three resonances (A true), includes 450 and 750 (B true).
  600 Hz = 4*150 is an even multiple, not allowed (C false).
  Spacing = 2*150 = 300 Hz (D true).
checks:
  - method: formula
    detail: (2n-1)*150 in [300,1200] -> 2n-1 in {3,5,7} -> n = 2,3,4 -> 3 modes, spacing v/(2L) = 300 Hz.
  - method: python (device)
    detail: "[f for f in (2n-1)*330/(4*0.55) if 300<=f<=1200] = [450, 750, 1050]; count 3; 600 not in list"
engine_features: [frequencies_in(lo, hi) with count / item / spacing]
