# Track B probe: a pulse on string a heading for a junction with string b
media:
  a: {type: string, mu: 0.01 kg/m, tension: 9 N}
  b: {type: string, mu: 0.04 kg/m, tension: 9 N}
junctions: {J: {at: 0 m, left: a, right: b}}
waves:
  p: {pulse: {on: a, from: left}}
observe: {f: "front(p, t=1[s])", r: "amplitude(p_reflected)"}
