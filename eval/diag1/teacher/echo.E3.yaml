# parent: eval/diag1/baselines/echo.yaml
# change: wavelength fixed at 10 m (source f = 340/10 Hz, teacher's choice) and listener position made a symbol d (100..140 m) so loudness can be plotted/evaluated vs distance
# kind: new question
id: diag1/echo
assume:
  - "Fixed wavelength 10 m is the teacher's choice (assumption), implemented as f = v/10 m."
  - "Amplitudes at the listener taken equal (spreading: none)."
  - "Rigid ceiling 25 m: no pressure phase change on reflection."
  - "Listener distance d is a free symbol; its value is set in observe/plot only."
symbols: {d: positive}
media:
  air: {type: gas, v: 340 m/s}
sources:
  S: {on: air, at: [0 m, 0 m], f: "340[m/s]/10[m]", A: 1, phase: 0, spreading: none}
reflectors:
  ceiling: {point: [0 m, 25 m], normal: [0, -1], boundary: rigid}
points:
  P: ["d", 0 m]
rays:
  direct: {from: S, to: P}
  up: {from: S, to: P, via: ceiling}
observe:
  loud: "relative_intensity(up, direct)"
