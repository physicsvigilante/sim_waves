symbols: {a: positive, q: real}
observe:
  p1: "max(a, 2*a) > a"
  p2: "abs(q) + 1 > 0"
  p3: "step(a) == 1"
  p4: "max(q, 0) >= 0"
  p5: "max(q, 0) > 0"
  p6: "min(q, 0) == 0"
  p7: "abs(q) == q"
  p8: "1e-16 > 0"
  p9: "1e-16 >= 2e-16"
  p10: "2e-16 <= 1e-16"
  p11: "sqrt(2)*1e-16 >= sqrt(3)*1e-16"
  p12: "sin(1e-16) > sin(5e-17)"
  p13: "log(1 + 1e-16) > 0"
  p14: "cos(1e-9) < 1"
  p15: "cos(1e-9) >= 1"
  p16: "atan(1e-16) <= atan(5e-17)"
  p17: "sin(1e-16) <= sin(5e-17)"
