arbitrary: {u: {value: 20 m/s, below: 340 m/s}}
observe:
  c1: "u < 335[m/s]"
  c2: "u > 5[m/s]"
  c3: "u < 340[m/s]"
  c4: "u > 0[m/s]"
  c5: "u < 300[m/s]"
  c6: "max(u, 340[m/s])"
  c7: "u"
  c8: "u == 20[m/s]"
  c9: "u/u == 1"
  c10: "0[m/s] < u < 340[m/s]"
  c11: "u >= 340[m/s]"
  c12: "u < 20.5[m/s]"
  c13: "u*u < 340[m/s]*u"
