symbols: {q: real, n: positive, k: integer, a: positive, b: positive}
given: ["n > 1"]
observe:
  s1: "n == 1"
  s2: "n > 0.5"
  s3: "n >= 1"
  s4: "n**2 > n"
  s5: "q**2 >= 0"
  s6: "q**2 > 0"
  s7: "a == b"
  s8: "a*b == b*a"
  s9: "a + b > a"
  s10: "sqrt(q**2) == q"
  s11: "abs(q) >= q"
  s12: "a > b"
  s13: "n < 1"
  s14: "1/n < 1"
  s15: "a - a == 0"
  s16: "k**2 >= k"
  s17: "a > 0 > b"
  s18: "a > b > a"
  s19: "max(a,b) >= a"
  s20: "n > 1 > 1/n"
  s21: "a/b == 1"
  s22: "q == q + 1e-13"
  s23: "a*1e-13 == 0"
