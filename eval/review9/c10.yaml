# two level difference: 10*log10(I1/I2) form; unknown powers; P1 + P2 == 11 W, level diff 10 dB at same distance -> P1 = 10, P2 = 1
unknowns: {P1: positive, P2: positive}
media: {air: {type: gas, v: 340 m/s}}
sources:
  S1: {on: air, at: [0 m, 0 m], power: P1, phase: random, spreading: spherical}
  S2: {on: air, at: [0 m, 0 m], power: P2, phase: random, spreading: spherical}
points: {A: [10 m, 0 m]}
rays: {a: {from: S1, to: A}, b: {from: S2, to: A}}
given:
  - "sound_level(intensity(a)) - sound_level(intensity(b)) == 10"
  - "P1 + P2 == 11[W]"
observe: {P1: "P1", P2: "P2"}
