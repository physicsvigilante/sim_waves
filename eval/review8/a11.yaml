waves: {w: {given: "0.01*sin(2*x - 3*t)", units: {x: m, t: s, y: m}, on: rope}}
observe:
  Kd2: "kinetic_density(w, x=2[m], t=0[s])"
  Kds: "kinetic_density(w, x=s, t=0[s])"
  K: "kinetic_energy(w, start=0[m], end=2[m], t=0[s])"
