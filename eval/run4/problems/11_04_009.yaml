id: 11/04/009
format: numerical
statement: 'A sound wave of wavelength 40 cm enters the tube shown in Figure from the source. What must
  be the smallest radius r of the semi-circular part of the tube, so that minima would be received by
  the detector?

  '
figure: A horizontal tube from Source (left) to Detector (right). In the middle the tube splits into a
  straight segment (along the diameter) and a semicircular arch above it of radius r (r drawn as an arrow
  from the centre to the arch).
