id: 11/02/011
format: numerical
statement: 'A long wire PQR is made by joining two wires PQ and QR of equal radii. PQ has a length 4.8
  m and mass 0.06 kg. QR has a length 2.56 m and mass 0.2 kg. The wire PQR is under a tension of 80 N.
  A sinusoidal wave pulse of amplitude 3.5 cm is sent along the wire PQ from the end P. No power is dissipated
  during the transmission of the wave pulse. Calculate

  (a) The time taken by the wave pulse to reach the other end R and

  (b) The amplitude of the reflected and transmitted wave pulse after the incident wave pulse crosses
  the joint Q.

  '
