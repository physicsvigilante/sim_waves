id: 11/05/014
format: numerical
statement: 'A 60 cm long flute can be considered to be a pipe open at both ends.

  (a) What is the fundamental frequency when all the holes are covered?

  (b) How far from the mouthpiece should a hole be uncovered for the fundamental frequency to be 330 Hz?

  Take speed of sound in air as 340 m s^-1.

  '
