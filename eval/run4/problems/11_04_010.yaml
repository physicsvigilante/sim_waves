id: 11/04/010
format: numerical
statement: 'A source emitting sound of frequency 180 Hz is placed in front of an obstacle at a distance
  2 m from it. A detector is also placed in front of obstacle at the same distance from it.

  (a) Find the minimum distance between the source and detector for which the detector detects a maximum
  sound.

  (b) How much further to the right must the obstacle be moved if the two waves are to be out of phase
  by 180 degrees.

  Speed of sound in air = 360 ms^-1.

  '
figure: A vertical obstacle (wall) on the right. Source S (bottom) and detector D (top) lie on a vertical
  line to the left of the wall, each 2 m from the wall (2 m dashed horizontal line from the midpoint of
  SD to the wall). Solution figure labels the separation SD = y, midpoint C, and reflection point O on
  the wall.
