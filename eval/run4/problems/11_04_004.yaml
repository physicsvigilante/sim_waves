id: 11/04/004
format: numerical
statement: 'Sound waves from a tuning fork A reach a point P by two separate paths ABP and ACP. When ACP
  is greater than ABP by 11.5 cm, there is silence at P. When the difference is 23 cm the sound becomes
  loudest at P and when 34.5 cm there is silence again and so on. Calculate the minimum frequency of the
  fork if the velocity of sound is taken to be 331.2 ms^-1.

  '
