id: 11/05/006
format: numerical
statement: 'A wire having a linear density of 0.05 g cm^-1 is stretched between two rigid supports with
  a tension of 450 N. It is observed that the wire resonates at a frequency of 420 Hz. The next higher
  frequency at which the same wire resonates is 490 Hz. Find the length of the wire.

  '
