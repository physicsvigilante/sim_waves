statement: 'The speed of a transverse wave travelling in a wire having a length 50 cm and mass 5 g is
  80 m/s. The area of cross-section of the wire is 1 mm^2 and its Young''s modulus is 16 x 10^11 N/m^2.
  Calculate the extension of the wire over its natural length.

