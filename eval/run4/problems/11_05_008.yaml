id: 11/05/008
format: numerical
statement: 'A metallic rod of length 1 m is rigidly clamped at one of its end. The other end of the rod
  is free. Longitudinal stationary waves are set up in the rod in such a way that there are total six
  antinodes observed along the rod. If antinode amplitude is 4x10^-6 m, Young''s modulus is 6.4x10^10
  N m^-2 and density of the rod is 5x10^3 kg m^-3, calculate the

  (a) wavelength of the constituent waves.

  (b) frequency of the constituent waves.

  (c) equation of the motion at the mid-point of the rod.

  '
