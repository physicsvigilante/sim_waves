id: 11/04/011
format: numerical
statement: 'Sources P and Q are two equally intense coherent sources emitting radiation of wavelength
  20 m as shown in Figure. The separation between P and Q is 5 m and the phase of P is ahead of that of
  Q by 90 degrees. A, B and C are three distinct points of observation, each equidistant from the midpoint
  of PQ. Calculate the ratio of intensities of radiation arriving at A, B and C.

  '
figure: 'Points on a horizontal line from left to right: C, P, Q, A. P and Q are close together at the
  centre (separation 5 m); A is to the right of Q and C is to the left of P, each equidistant from the
  midpoint of PQ. B is directly above the midpoint of PQ (dashed vertical line from the midpoint to B),
  equidistant from the midpoint like A and C. No numerical distances are labelled in the figure besides
  PQ = 5 m in the text.'
