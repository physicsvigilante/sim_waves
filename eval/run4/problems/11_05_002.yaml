id: 11/05/002
format: numerical
statement: 'A string fixed at both ends has consecutive standing wave modes for which the distances between
  adjacent nodes are 18 cm and 16 cm respectively.

  (a) What is the minimum possible length of the string in cm?

  (b) If the tension is 10 N and the linear mass density is 4 gm^-1, what is the fundamental frequency,
  in Hz, to the nearest two digit integer.

  '
