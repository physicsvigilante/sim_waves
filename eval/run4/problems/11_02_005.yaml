id: 11/02/005
format: numerical
statement: 'A uniform rope of length 10 cm and mass 4 kg hangs vertically from a rigid support. A block
  of mass 2 kg is attached to the free end of the rope. A transverse pulse of wavelength 0.06 m is produced
  at the lower end of the rope, what is the wavelength of the pulse when it reaches the top of the rope?

  '
figure: 'Rope hanging from a ceiling with a 2 kg block at the bottom. Rope labelled 4 kg. Point 1 marked
  at the lower end of the rope (just above the block), point 2 at the top end (at the support).

  '
