format: numerical
statement: 'Three component sinusoidal waves progressing in the same direction along the same path have
  the same period but their amplitudes are A, A/2 and A/3. The phases of the variation at any position
  x on their path at time t = 0 and 0, -pi/2 and -pi respectively. Find the amplitude and phase of the
  resultant wave.

  '
