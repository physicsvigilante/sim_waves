id: 11/05/016
format: numerical
statement: 'A string 25 cm long and having a mass of 2.5 g is under tension. A pipe closed at one end
  is 40 cm long. When the string is set vibrating in its first overtone and the air in the pipe in its
  fundamental frequency, 8 beats per second are heard. It is observed that decreasing the tension in the
  string decrease the beat frequency. If the speed of sound in air is 320 m s^-1, find the tension in
  the string.

  '
