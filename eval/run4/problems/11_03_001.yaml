id: 11/03/001
format: numerical
statement: 'A point A is located at a distance r = 1.5 m from a point source of sound of frequency 600
  Hz. The power of the source is 0.8 watt. Speed of sound in air is 340 ms^-1 and density of air is 1.29
  kgm^-3. Find at the point A,

  (a) the pressure oscillation amplitude (deltaP)_m

  (b) the displacement oscillation amplitude A.

  '
