id: 11/03/010
format: numerical
statement: 'A plane longitudinal wave having angular frequency omega = 500 sec^-1 is travelling in positive
  x-direction in a medium of density rho = 1 kgm^-3 and bulk modulus 4 x 10^4 Nm^-2. The loudness at a
  point in the medium is observed to be 20 dB. Assuming at x = 0 initial phase of the medium particles
  to be zero, find the

  (a) maximum pressure change in the medium

  (b) equation of the wave.

  '
