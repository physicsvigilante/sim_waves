id: 11/02/007
format: numerical
statement: 'One end of 12 m long rubber tube with a total mass of 900 g is fastened to a fixed support.
  A cord attached to the other and passes over a pulley and supports an object with a mass of 5 kg. The
  tube is struck a transverse blow at one end. Find the time required for the pulse to reach the other
  end. Take g = 9.8 m/s^2.

  '
