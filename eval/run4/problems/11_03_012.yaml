id: 11/03/012
format: numerical
statement: 'For a person with normal hearing, the faintest sound that can be heard at a frequency of 400
  Hz has a pressure amplitude of about 6 x 10^-5 Pa. Calculate the corresponding intensity in Wm^-2. Take
  speed of sound in air as 344 ms^-1 and density of air 1.2 kgm^-3.

  '
