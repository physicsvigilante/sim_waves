id: 11/03/013
format: numerical
statement: 'The faintest sound that the human ear can detect at frequency 1 kHz corresponds to an intensity
  of about 10^-12 Wm^-2. Determine the pressure amplitude and the maximum displacement associated with
  this sound assuming the density of the air = 1.3 kgm^-3 and velocity of sound in air = 332 ms^-1.

  '
