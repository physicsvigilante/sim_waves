id: 11/02/012
format: numerical
statement: 'Two strings 1 and 2 are taut between two fixed supports (as shown in figure) such that the
  tension in both strings is same. Mass per unit length of 2 is more than that of 1. Explain which string
  is denser for a transverse travelling wave.

  '
figure: 'Two strings joined end to end between two fixed vertical supports (left and right walls). String
  1 (thin line) on the left, string 2 (thicker line) on the right. No numbers.

  '
