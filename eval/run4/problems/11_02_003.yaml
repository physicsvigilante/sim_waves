id: 11/02/003
format: numerical
statement: 'Two blocks each having a mass of 3.2 kg are connected by a wire CD and the system is suspended
  from the ceiling by another wire AB as shown in Figure. The linear mass density of the wire AB is 10
  g/m and that of CD is 8 g/m. Calculate the speed of a transverse wave pulse produced in AB and in CD.

  '
figure: 'Vertical arrangement: ceiling at top, wire AB hangs from A (top) to B, ending at the first block
  (3.2 kg); from this block wire CD hangs from C (top) to D, ending at the second (lower) block (3.2 kg).

  '
