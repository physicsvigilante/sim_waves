id: 11/04/008
format: numerical
statement: 'Two sound sources S1 and S2 emit pure sinusoidal waves in phase. If the speed of sound is
  350 ms^-1, then for what frequencies,

  (a) constructive interference occurs at P?

  (b) destructive interference occurs at P?

  '
figure: S1 and S2 lie on a horizontal line, S1 on the left and S2 on the right. The foot of the perpendicular
  from P is 2 m from S1 and 1 m from S2 (labels 2 m and 1 m on the horizontal line). P is 4 m directly
  above that foot (label 4 m on the dashed vertical).
