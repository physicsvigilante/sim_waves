id: 11/02/002
format: numerical
statement: 'A wave pulse starts propagating in the positive x-direction along a non-uniform wire of length
  l with a mass per unit length given by mu = mu0 + alpha x and under a tension 100 N. Find the time taken
  by the pulse to travel from the lighter end (x = 0) to the heavier end where mu0 and alpha are constant.

  '
