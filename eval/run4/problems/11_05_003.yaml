id: 11/05/003
format: numerical
statement: 'The vibrations of a string fixed at both ends are described by the equation

  y = (5 mm) sin[(1.57 cm^-1) x] sin[(314 s^-1) t]

  (a) What is the maximum displacement of the particle at x = 5.66 cm?

  (b) What are the wavelengths and the wave speeds of the two transverse waves that combine to give the
  above vibration?

  (c) What is the velocity of the particle at x = 5.66 cm at time t = 2 s?

  (d) If the length of the string is 10 cm, locate the nodes and the antinodes. How many loops are formed
  in the vibration.

  '
