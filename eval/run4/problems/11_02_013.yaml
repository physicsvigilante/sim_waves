id: 11/02/013
format: numerical
statement: 'A string of length 40 cm and weighing 10 g is attached to a spring at one end and to a fixed
  wall at the other end. The spring has a spring constant of 160 N/m and is stretched by 1 cm. If a wave
  pulse is produced on the string near the wall, calculate the time taken by the wave pulse to reach the
  spring.

  '
