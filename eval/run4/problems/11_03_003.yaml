id: 11/03/003
format: numerical
statement: 'A dog while barking delivers about 1 mW of power. Assuming this power to be uniformly distributed
  over a hemispherical area, calculate the sound level at a distance of 5 m. Also calculate the sound
  level if instead of one dog, five dogs start barking at the same time each delivering 1 mW of power.

  '
