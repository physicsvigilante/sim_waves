id: 11/02/001
format: numerical
statement: 'A wire of variable mass per unit length mu = mu0 x, is hanging from the ceiling as shown in
  figure. The length of wire is l0. A small transverse disturbance is produced at its lower end. Find
  the time after which the disturbance will reach to the other ends.

  '
figure: 'A vertical wire hanging from a ceiling (horizontal hatched bar at top), free lower end. No numbers.
  (Solution figure: x measured upward from the lower end to the position of the travelling kink; v arrow
  pointing up.)

  '
