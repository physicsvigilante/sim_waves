id: 11/05/012
format: numerical
statement: 'A tube 1 m long is closed at one end. A stretched wire is placed near the open end. The wire
  is 0.3 m long and has a mass of 0.01 kg. It is held fixed at both ends and vibrates in its fundamental
  mode. It sets the air column in the tube into vibration at its fundamental frequency by resonance. Calculate
  the frequency of oscillation of the air column and tension in the wire if speed of sound in air is v
  = 330 m s^-1.

  '
