id: 11/05/009
format: numerical
statement: 'A string is stretched with tension T between two rigid supports. A wave y = A sin(kx - wt)
  is produced in the string at left end. Stationary waves are formed due to reflection from the rigid
  supports. Calculate the

  (a) instantaneous kinetic energy contained in the string between two nodes.

  (b) maximum kinetic energy.

  (c) average kinetic energy over a cycle.

  '
