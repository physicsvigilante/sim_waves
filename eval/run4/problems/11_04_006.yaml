id: 11/04/006
format: numerical
statement: 'Two loudspeakers S1 and S2 vibrating in the same phase, each emit sounds of frequency 220
  Hz uniformly in all directions. S1 has an acoustic output of 1.2 x 10^-3 watt and S2 has 1.8 x 10^-3
  watt. Consider a point P such that S1P = 0.75 m and S2P = 3 m. How are the phases arriving at P related?
  What is the intensity at P when both S1 and S2 are on? Speed of sound in air is 330 ms^-1.

  '
