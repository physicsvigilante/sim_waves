id: 11/01/002
format: numerical
statement: 'A transverse harmonic wave of amplitude 0.02 m is generated at x = 0 at one end of a long
  horizontal string by a tuning fork of frequency 500 Hz. At a given instant of time, the displacement
  of the particle at x = 0 is zero, the displacement of a particle at x = 0.1 m is -0.01*sqrt(3) m and
  that of a particle at x = 0.8 m is 0.01*sqrt(3). Find the velocity of the wave.

  '
