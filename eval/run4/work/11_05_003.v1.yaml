id: 11/05/003
assume:
  - "Component waves: 2.5 sin(1.57 x - 314 t) and 2.5 sin(1.57 x + 314 t) (mm, x in cm, t in s), whose sum is the stated standing wave."
  - "Part (d): string modelled as a fixed-fixed resonator of length 10 cm on a wire of arbitrary mu and T (they cancel in mode geometry); the mode is the one whose wavelength equals the component wavelength."
  - "x in the equivalence check is an SI number (metres): 1.57 per cm = 157 per m."
symbols: {mu: positive, T: positive}
unknowns: {n: integer}
waves:
  f1: {given: "2.5*sin(1.57*x - 314*t)", units: {x: cm, t: s, y: mm}}
  f2: {given: "2.5*sin(1.57*x + 314*t)", units: {x: cm, t: s, y: mm}}
  tot: {sum: [f1, f2]}
media:
  wire: {type: string, mu: mu, tension: T}
resonators:
  r: {type: string, on: wire, length: 10 cm, ends: [fixed, fixed]}
given:
  - {fact: "wavelength(r, harmonic=n) == wavelength(f1)", source: assumption, note: "the vibration is the mode made of f1 and f2"}
observe:
  same: "equivalent(y(tot, x=x, t=t), 5*sin(157*x)*sin(314*t)*1[mm])"
  maxdisp: "max_over(t, abs(y(tot, x=5.66[cm], t=t)))"
  lam: "wavelength(f1)"
  v1: "velocity(f1)"
  v2: "velocity(f2)"
  vy: "vy(tot, x=5.66[cm], t=2[s])"
  n: "n"
  nodes: "nodes(r, harmonic=n)"
  antinodes: "antinodes(r, harmonic=n)"
  nloops: "count(antinodes(r, harmonic=n))"
