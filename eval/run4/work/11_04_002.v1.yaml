id: 11/04/002
assume:
  - "Waves modelled as two coherent sound rays of the same frequency (170 Hz, v 340 m/s: arbitrary, ratio is independent) with amplitudes 3 and 5 units."
  - "Maximum: in-phase arrival (equal path lengths). Minimum: antiphase arrival (path difference of half a wavelength, 1 m). These are the extreme cases asked for."
media: {air: {type: gas, v: 340 m/s}}
sources:
  S1: {on: air, f: 170 Hz, A: 3, phase: 0, spreading: none}
  S2: {on: air, f: 170 Hz, A: 5, phase: 0, spreading: none}
  S3: {on: air, f: 170 Hz, A: 3, phase: 0, spreading: none}
  S4: {on: air, f: 170 Hz, A: 5, phase: 0, spreading: none}
rays:
  m1: {from: S1, length: 4 m}
  m2: {from: S2, length: 4 m}
  n1: {from: S3, length: 4 m}
  n2: {from: S4, length: 5 m}
given: []
observe:
  dphi_max: "wrap(phase_difference(m1, m2))"
  dphi_min: "wrap(phase_difference(n1, n2))"
  Imax: "relative_intensity(m1, m2)"
  Imin: "relative_intensity(n1, n2)"
  ratio: "relative_intensity(n1, n2)/relative_intensity(m1, m2)"
