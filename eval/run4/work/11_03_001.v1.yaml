id: 11/03/001
assume: ["Isotropic point source in free space; intensity from emitter. Pressure and displacement amplitude need I=p^2/(2 rho v); attempt via observables."]
media:
  air: {type: gas, v: 340 m/s, density: 1.29 kg/m^3}
emitters:
  pt: {on: air, geometry: point, power: 0.8 W}
observe:
  I: "intensity(pt, r=1.5[m])"
