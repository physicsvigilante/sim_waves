id: 11/02/006
assume: ["Tension supplied by the wave speed (free tension); the stretch is then a hand step with Y and A."]
media:
  wire: {type: string, mass: 5 g, length: 50 cm, tension: free}
waves:
  w: {harmonic: {on: wire, A: 1 mm, f: 100 Hz, v: 80 m/s, dir: +x, phase: 0}}
observe:
  T: "tension(wire, at=0.1[m])"
  mu: "mu(wire)"
  imp: "impedance(wire)"
