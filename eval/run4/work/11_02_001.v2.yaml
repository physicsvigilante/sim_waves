id: 11/02/001
assume: ["Probe: what tension does the engine use for mu = mu0*s? (v1 gave an acceleration g/2, which is the uniform-rope value.)"]
symbols: {mu0: positive, l0: positive, g: positive, s: positive}
media:
  wire:
    type: string
    mu: "mu0*s"
    length: l0
    coordinate: {origin: lower_end, direction: up}
    tension: {hanging: {load: 0 kg, g: g}}
observe:
  T: "tension(wire, at=s)"
  v: "speed(wire, at=s)"
