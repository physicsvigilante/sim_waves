id: 11/01/002
assume:
  - "Wave travels +x, away from the source at x=0."
  - "Snapshot instant taken as t=0, source phase ph unknown. Wavelength is treated through the wavenumber: k = 2*pi/lam is unknown k (positive); the engine only solves unknowns inside sines with numeric coefficients, so x values are fixed numbers times k."
unknowns: {k: positive, ph: phase}
waves:
  w: {harmonic: {A: 0.02 m, f: 500 Hz, k: k, dir: +x, phase: ph}}
given:
  - {fact: "y(w, x=0[m], t=0[s]) == 0[m]", source: stated}
  - {fact: "y(w, x=0.1[m], t=0[s]) == -0.01*sqrt(3)[m]", source: stated}
  - {fact: "y(w, x=0.8[m], t=0[s]) == 0.01*sqrt(3)[m]", source: stated}
observe:
  k: "k"
  ph: "ph"
  lam: "wavelength(w)"
  v: "speed(w)"
