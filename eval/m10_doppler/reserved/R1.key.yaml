id: B4/single/44
book_key: B
book_key_source: page 4.122, Single Correct Choice Type Questions, "44. B"
solution: |
  Method 1 (textbook formula). Source speed vs constant, listener at rest.
  While approaching, f = f0 v/(v - vs), a constant above f0. After the source passes,
  f = f0 v/(v + vs), a constant below f0. The heard frequency is a constant high
  value, then a constant low value: a step down. Graph B.
  Method 2 (emission-time computation). Numerically solved
  |r_L - r_S(t_e)| = v (t - t_e) for t_e and took f = f0 dt_e/dt, for f0 = 1000 Hz,
  v = 340 m/s, vs = 40 m/s, source passing the listener with a 0.5 m offset
  (closest at t = 5 s). Heard: 1133.3 Hz (t = 1, 4 s), 1132.4 (4.9 s), 1014.0
  (5.0 s), 894.8 (5.3 s), 894.7 (6, 9 s). Formula values: 1133.3 and 894.7.
  The result is flat-high, a near-vertical drop, then flat-low: graph B (the drop
  becomes an exact step when the source passes through the listener).
answer: B
agrees_with_book: true
note: |
  Graph D is a step up (wrong direction). A and C are wrong because f is constant
  on each side of the passage for constant velocity.
