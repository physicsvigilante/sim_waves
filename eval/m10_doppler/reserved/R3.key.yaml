id: B4/jee_main/50
book_key: A
book_key_source: page 4.123, Archive JEE Main, "50. A"
solution: |
  Method 1 (textbook formula). Source and observer approach each other:
  f = f0 (v + v0)/(v - vs) = f0 v/(v - vs) + [f0/(v - vs)] v0.
  Linear in v0 with positive intercept f0 v/(v - vs) and slope f0/(v - vs):
  graph A (f against v0), slope f0/(v - vs). Not linear in 1/v0, so not graph B.
  Method 2 (emission-time computation). f0 = 500 Hz, v = 340 m/s, vs = 40 m/s,
  observer approaching at v0 = 0, 10, 20, 40 m/s; numerical t_e and f = f0 dt_e/dt
  gave 566.667, 583.333, 600.000, 633.333 Hz: equal steps of 1.6667 Hz per m/s
  = 500/300 = f0/(v - vs), intercept 566.667 = f0 v/(v - vs).
answer: A
agrees_with_book: true
