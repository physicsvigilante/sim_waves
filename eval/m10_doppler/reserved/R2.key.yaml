id: B4/jee_advanced/17
book_key: D
book_key_source: page 4.123, Archive JEE Advanced, Single Correct Choice Type Problems, "17. D"
solution: |
  Method 1 (textbook formula). f = f0 v/(v - vs).
  f1/f2 = (v - 17)/(v - 34) = 323/306 = 19/18.
  Method 2 (emission-time computation). Source on a line approaching a fixed
  observer, solved |x_L - x_S(t_e)| = v (t - t_e) numerically, f = f0 dt_e/dt with
  f0 = 1: ratio of the two heard frequencies = 1.0555555555 = 19/18.
  Also by wavelength: lambda = (v - vs)/f0, so f1/f2 = lambda2/lambda1 = 323/306.
answer: D
agrees_with_book: true
