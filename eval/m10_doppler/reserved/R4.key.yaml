id: B4/jee_advanced/50
book_key: C, D
book_key_source: page 4.124, Archive JEE Advanced, Multiple Correct Choice Type Problems, "18. C, D"
solution: |
  Physical picture: a source moving at constant velocity passes the observer at some
  distance. Long after, f -> f0 v/(v + vs) (the 1800 asymptote); long before,
  f -> f0 v/(v - vs) (upper bound for f_m); at the closest approach f = f0 (the
  inflection crossing).
  Reading 1 (figure: f0 = 2000 Hz, the crossing line):
    1800 = 2000*300/(300 + vs) -> vs = 33.33 m/s (C).
    f_m < 2000*300/(300 - 33.33) = 2250 Hz (D).
  Reading 2 (statement as printed: f0 = 2200 Hz):
    1800 = 2200*300/(300 + vs) -> vs = 66.67 m/s (A).
    f_m < 2200*300/(300 - 66.67) = 2828.6 Hz, so neither B nor D holds.
  Check 2 (emission-time computation): source moving on a line 50 m from the
  observer, f = f0 dt_e/dt from numerical t_e.
    f0 = 2000, vs = 33.333: f = 2249.4 (t=0, far approaching), 2025.0 near
    passage, 1800.2 -> 1800.0 late. Max 2250, min 1800, crossing 2000. Matches
    reading 1 and the figure.
    f0 = 2200, vs = 66.667: 2828.2 early, 1800.0 late, crossing 2200 (not the
    2000 line). Matches reading 2 but contradicts the figure's 2000 crossing.
answer_reading_1: C, D (strictly B is also a true statement, since f_m < 2250 < 2500; the intended answer is the tight bound)
answer_reading_2: A
agrees_with_book: partly
note: |
  DISAGREEMENT / DEFECT. The printed f0 = 2200 Hz is inconsistent with the figure,
  whose curve crosses the 2000 Hz line (closest approach, f = f0). The book key
  C, D corresponds to f0 = 2000 Hz. With the data as printed the correct choice is
  A only. Also, under f0 = 2000 Hz, option B is literally true (a weaker bound
  than D) though the key omits it. Grade against reading 1 (C, D) if the figure
  is taken as authoritative; flag the item as defective.
