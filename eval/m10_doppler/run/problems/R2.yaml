id: B4/jee_advanced/17
book: wanes_full.pdf, Archive JEE Advanced, Single Correct Choice Type Problems, problem 17 [IIT-JEE 2000], page 4.114
type: single_correct
statement: |
  A train moves towards a stationary observer with speed 34 m s^-1. The train
  sounds a whistle and its frequency registered by the observer is f1. If the
  train's speed is reduced to 17 m s^-1, the frequency registered is f2. If the
  speed of sound is 340 m s^-1 then the ratio f1/f2 is
options:
  A: "18/19"
  B: "1/2"
  C: "2"
  D: "19/18"
