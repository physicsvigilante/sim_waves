
media: {air: {type: gas, v: 340 m/s}}
sources: {car: {on: air, at: [-100 m, 10 m], velocity: [20 m/s, 0 m/s], f: 500 Hz, A: 1, phase: 0, spreading: none}}
points: {O: [0 m, 30 m]}
reflectors: {wall: {point: [0 m, 0 m], normal: [0, 1], boundary: rigid}, mv: {point: [0 m, 0 m], normal: [0, 1], boundary: rigid, velocity: [0 m/s, 1 m/s]}}
rays: {e: {from: car, to: O, via: wall}, m: {from: car, to: O, via: mv}}
observe:
  e: "frequency(e, t=2[s])"
  e5: "frequency(e, emitted=5[s])"    # 500
  m: "frequency(m, t=2[s])"   # refuse
