media: {air: {type: gas, v: 340 m/s}}
unknowns: {u: positive}
sources: {a: {on: air, at: [0 m, 0 m], f: 500 Hz, A: 1, phase: 0, spreading: none}}
points: {O: [1 m, 0 m]}
reflectors: {wall: {point: [500 m, 0 m], normal: [-1, 0], boundary: rigid, velocity: [-u, 0 m/s]}}
rays: {e: {from: a, to: O, via: wall}, d: {from: a, to: O}}
given:
  - {fact: "frequency(e, emitted=0[s]) == 520[Hz]", source: stated}
  - {fact: "u < 100[m/s]", source: stated}
observe: {u: "u", beats: "beat_frequency(e, d, t=1[s])"}
