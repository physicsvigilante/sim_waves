id: 23/05/cnt_006
format: numerical
statement: 'A metal wire of diameter 1 mm is held on two knife edges separated by a distance of 50 cm.
  The tension in the wire is 100 N. The wire, vibrating with its fundamental frequency and a vibrating
  tuning fork together produces 5 beats per second. The tension in the wire is then reduced to 81 N. When
  the two are excited, beats are heard at the same rate. Calculate the linear mass density of the wire
  (in kg/m).

  '
