id: 23/01/cnt_007
format: numerical
statement: 'S1 and S2 are two coherent sources of sound separated by distance 100.25 lambda, where A is
  the wavelength of sound. S1 leads S2 in phase by pi/2. A and B are two points on the line joining S1
  and S2, as shown in figure. The ratio of amplitudes of the sound waves produced by the source S1 and
  S2 are nearly in ratio 1:2, for waves reaching at A as well as B. Find the ratio of intensity at A to
  that at B, is (I_A / I_B).

  '
figure: 'A horizontal line with four dots in order from left to right: A, S1, S2, B. A and B are far from
  the sources (A well left of S1, B well right of S2); S1 and S2 are close together with a double-headed
  arrow between them labelled 100.25 lambda.

  '
