id: 23/01/cnt_004
format: numerical
statement: 'A source of sound S and a detector D are placed at some distance from one another. A big cardboard
  is placed near the detector and perpendicular to the line SD as shown in figure. It is gradually moved
  away and it is found that the intensity changes from a maximum to a minimum as the board is moved through
  a distance of 20 cm. Find the frequency (in Hz) of the sound emitted. Velocity of sound in air is 336
  m/s.

  '
figure: 'Horizontal line from a dot labelled S (left) to a dot labelled D (middle), continued as a dashed
  line from D to a tall vertical board (rectangle) at the right, perpendicular to the line. No dimensions
  or numbers are marked.

  '
