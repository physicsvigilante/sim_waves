id: 23/03/cnt_007
format: numerical
statement: 'A string 1 m long is fixed at one end and is attached to a 300 Hz vibrator at its other end.
  The end connected to the vibrator is moving with very small amplitude and can be considered to be fixed.
  The string vibrates forming two nodes between the ends. Find the speed of transverse waves in the string
  (in m/s).

  '
