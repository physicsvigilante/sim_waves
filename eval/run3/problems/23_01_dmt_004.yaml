id: 23/01/dmt_004
format: matrix_match
statement: 'Two small speakers separated by some distance emit sound of same frequency. At some point
  A, the intensity due to each of them is I0. Path length from one of the speakers to A is lambda/2 larger
  than the path length from the other speaker to A. lambda is wavelength of the sound. Column (I) gives
  characteristics of the two speakers and Column (II) gives the resultant intensity at A. Match them.

  '
options:
  column_i:
    a: The speakers are incoherent, and phase difference between them changes rapidly
    b: The speakers are coherent and in phase
    c: The speakers are coherent but have a phase difference pi between them
    d: The speakers are coherent and in phase. The two speakers and the point A lie on a straight line
  column_ii:
    p: I0
    q: 4 I0
    r: '0'
    s: 2 I0
