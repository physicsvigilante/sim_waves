id: 23/02/cnt_004
format: numerical
statement: 'A composite string has two sections AB and BC. The linear mass densities of the two strings
  are m and 4m. A sinusoidal pulse of amplitude a begins to travel from A towards C. At the joint B the
  wave suffers reflection and transmission. Find the ratio of wavelengths of the reflected and the transmitted
  pulses.

  '
figure: 'Horizontal string with points A (left end), B (middle) and C (right end) labelled. Section AB
  is drawn with a thin line, section BC with a thick (bold) line. Near the left, on AB, a one-cycle sinusoidal
  pulse (crest first, then trough) with an arrow above it pointing right (towards B). No numbers on the
  figure.

  '
