id: 23/05/asc_009
assume:
  - "Time from maximum to minimum loudness is half a beat period; the engine has no observable for the waxing/waning envelope, so I write 1/(2*beat_frequency)."
symbols: {a: positive}
waves:
  y1: {given: "a*sin(2*pi*380*t)", units: {x: m, t: s, y: m}}
  y2: {given: "a*sin(2*pi*384*t)", units: {x: m, t: s, y: m}}
observe:
  beats: "beat_frequency(y1, y2)"
  t_max_to_min: "1/(2*beat_frequency(y1, y2))"
