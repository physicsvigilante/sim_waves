id: 23/03/asc_004
assume:
  - "mu = 10 g/m is a placeholder (not given); only frequency ratios matter, and the unknown tension absorbs it."
  - "Sonometer wire fundamental (fixed-fixed) at lengths 20 cm and 21 cm with the same tension and wire; tension and density unspecified so tension is left an unknown that the beat facts fix."
  - "v3: the engine crashed (sympy NaN comparison) on beat_frequency with an unknown inside given, so beat frequency 5 Hz is written as (f_wire - f_fork)^2 = (5 Hz)^2. Beat frequency is the absolute difference between fork and wire frequency, equal at 5 Hz for both lengths."

unknowns: {T: positive, f0: positive}
media:
  wire: {type: string, mu: 10 g/m, tension: T}
resonators:
  r20: {type: string, on: wire, length: 20 cm, ends: [fixed, fixed]}
  r21: {type: string, on: wire, length: 21 cm, ends: [fixed, fixed]}
given:
  - {fact: "(frequency(r20, harmonic=1) - f0)**2 == 25[Hz]**2", source: stated}
  - {fact: "(frequency(r21, harmonic=1) - f0)**2 == 25[Hz]**2", source: stated}
observe:
  fork: "f0"
  f_20: "frequency(r20, harmonic=1)"
  beat20: "beat_frequency(frequency(r20, harmonic=1), f0)"
  beat21: "beat_frequency(frequency(r21, harmonic=1), f0)"
  f_21: "frequency(r21, harmonic=1)"
