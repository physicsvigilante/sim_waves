id: m8/R1
answer:
  a: 0.40 m
  b: 3.84e-2 J
  c: 1.04e-2 J
  d: 1.6e-2 J/m
solution: |
  Wave speed v = sqrt(T/mu) = sqrt(80/0.050) = 40 m/s. The pulse is y(x,t) = f(x - v t).
  Slopes of the shape: leading-from-left rising edge s1 = 6.0e-3/0.10 = 0.060,
  falling edge s2 = 6.0e-3/0.30 = 0.020 (magnitudes).
  For a pulse travelling without change of shape, dy/dt = -v dy/dx, so the kinetic
  density (1/2) mu (dy/dt)^2 = (1/2) mu v^2 (dy/dx)^2 = (1/2) T (dy/dx)^2 equals the
  potential density at every point and instant.
  (a) Non-zero from x = 0.20 m to x = 0.60 m: width 0.40 m (unchanged as it travels).
  (b) Total density = T (dy/dx)^2. E = T [s1^2 (0.10) + s2^2 (0.30)]
      = 80 [3.6e-3 x 0.10 + 4.0e-4 x 0.30] = 80 x 4.8e-4 = 3.84e-2 J.
  (c) In 20 ms the pulse moves 0.80 m: rising edge on 1.00-1.10 m, falling edge on
      1.10-1.40 m. The stretch 1.05-1.30 m holds 0.05 m of rising edge and 0.20 m of
      falling edge. K = (1/2) T [s1^2 (0.05) + s2^2 (0.20)]
      = 40 [1.8e-4 + 8.0e-5] = 1.04e-2 J.
  (d) x = 1.25 m lies on the falling edge: u_P = (1/2) T s2^2 = 40 x 4.0e-4 = 1.6e-2 J/m.
  Checked numerically (Simpson integration of (1/2)mu y_t^2 + (1/2)T y_x^2 with finite-
  difference derivatives of the shifted profile; width from sampling the support).
conventions_used:
  - Linear-elastic small-slope string; energy densities per unit length
    u_K = (1/2) mu (dy/dt)^2, u_P = (1/2) T (dy/dx)^2.
  - Mechanical energy = kinetic + elastic potential; gravity ignored.
  - Width = length of x over which displacement is non-zero.
