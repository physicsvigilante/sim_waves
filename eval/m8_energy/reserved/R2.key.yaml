id: m8/R2
answer:
  a: 0.60 m
  b: 5.55e-3 J
  c: 1.67e-2 J
  d: 2.78e-2 J/m
solution: |
  v1 = sqrt(36/0.090) = 20 m/s, v2 = sqrt(36/0.010) = 60 m/s.
  Displacement amplitude ratios at the joint (continuity of y and of slope force):
  r = (v2 - v1)/(v1 + v2) = 0.5 (upright reflection), tau = 2 v2/(v1 + v2) = 1.5.
  Incident: half-width b = 0.10 m, A = 5.0 mm, y = (A/2)[1 + cos(pi s/b)].
  For a lone travelling pulse total density = T (dy/dx)^2, so
  E_inc = T (A pi/(2b))^2 integral sin^2(pi s/b) ds over 2b = T A^2 pi^2/(4b)
        = 36 x 25e-6 x pi^2 / 0.40 = 2.2207e-2 J.
  (a) Each point of the incident profile crosses the joint at a time set by v1; on the
      right string the profile is stretched by v2/v1 = 3: width = 0.20 x 3 = 0.60 m.
  (b) Reflected pulse: same shape and width on the same string, amplitude r A:
      E_R = r^2 E_inc = 0.25 x 2.2207e-2 = 5.55e-3 J.
  (c) Transmitted: amplitude tau A = 7.5 mm, half-width b' = 0.30 m:
      E_T = T (tau A)^2 pi^2/(4 b') = tau^2 (v1/v2) E_inc = 0.75 E_inc = 1.666e-2 J.
      Check: E_R + E_T = E_inc.
  (d) On the right string u_K = (1/2) mu2 v2^2 (dy/dx)^2 = (1/2) T (dy/dx)^2. Maximum slope
      of the transmitted pulse = tau A pi/(2 b') = 7.5e-3 x pi/0.60 = 3.927e-2.
      u_K,max = 18 x (3.927e-2)^2 = 2.78e-2 J/m.
  Checked numerically: built y on each string from the incident shape (reflected
  r f(-x - v1 t), transmitted tau f(v1 x/v2 - v1 t)), Simpson-integrated the full
  kinetic + potential densities at t = 60 ms, and sampled the support and max u_K.
conventions_used:
  - Massless joint; y and dy/dx continuous at x = 0; common tension.
  - Energy densities per unit length u_K = (1/2) mu (dy/dt)^2, u_P = (1/2) T (dy/dx)^2;
    pulse energy = integral of u_K + u_P over its string.
  - Width = length of x over which displacement is non-zero.
