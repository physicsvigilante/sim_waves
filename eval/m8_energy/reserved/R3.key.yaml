id: m8/R3
answer:
  a: 9.87e-2 J/m
  b: 3.95e-2 J
  c: 1.21e-3 J
solution: |
  k = 5 pi rad/m (lambda = 0.40 m), omega = 200 pi rad/s, v = omega/k = 40 m/s,
  T = mu v^2 = 0.025 x 1600 = 40 N. A1 = 4.0e-3 m, A2 = 2.0e-3 m.
  Let a = kx - wt, b = kx + wt.
  dy/dx = k (A1 cos a + A2 cos b), dy/dt = omega (-A1 cos a + A2 cos b).
  (a) x = 0.050 m: kx = pi/4; t = 0.50 ms: wt = pi/10. a = 0.15 pi, b = 0.35 pi.
      dy/dx = 5 pi (4e-3 cos 27deg + 2e-3 cos 63deg) = 5 pi (3.5640e-3 + 0.9080e-3)
            = 7.0247e-2.
      u_P = (1/2)(40)(7.0247e-2)^2 = 9.87e-2 J/m.
  (b) Using T k^2 = mu omega^2, the total density is
      u = (1/2) mu omega^2 [(A1 cos a - A2 cos b)^2 + (A1 cos a + A2 cos b)^2]
        = mu omega^2 (A1^2 cos^2 a + A2^2 cos^2 b): the cross terms cancel.
      Over a whole wavelength (0 to 0.40 m) each cos^2 averages to 1/2 at any instant:
      E = (1/2) mu omega^2 (A1^2 + A2^2) lambda
        = 0.5 x 0.025 x (200 pi)^2 x 2.0e-5 x 0.40 = 3.95e-2 J (independent of t).
  (c) Time-averaging u_K = (1/2) mu omega^2 (A1 cos a - A2 cos b)^2 over a period:
      <cos^2 a> = <cos^2 b> = 1/2, <cos a cos b> = (1/2) cos 2kx, so
      <u_K> = (1/4) mu omega^2 [A1^2 + A2^2 - 2 A1 A2 cos 2kx].
      Integrate over 0 <= x <= L = 0.050 m (2kL = pi/2):
      <K> = (1/4) mu omega^2 [(A1^2 + A2^2) L - A1 A2 sin(2kL)/k]
          = (1/4)(0.025)(200 pi)^2 [2.0e-5 x 0.050 - 8.0e-6/(5 pi)]
          = 2467.4 x [1.0e-6 - 5.093e-7] = 1.21e-3 J.
  Checked numerically: finite-difference derivatives of y, Simpson integration in x,
  and for (c) a further Simpson integration over one period divided by the period.
conventions_used:
  - Energy densities per unit length u_K = (1/2) mu (dy/dt)^2, u_P = (1/2) T (dy/dx)^2.
  - Tension from v = omega/k = sqrt(T/mu).
  - Time average over one period T_p = 2 pi/omega = 10 ms: (1/T_p) integral over [0, T_p].
