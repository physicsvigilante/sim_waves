id: B4/jee_advanced/2
assume:
  - "Pipe end correction neglected (not stated)."
  - "String fixed at both ends (vibrating string, second harmonic)."
unknowns: {M: positive}
media:
  air: {type: gas, v: 320 m/s}
  wire: {type: string, mass: M, length: 0.5 m, tension: 50 N}
resonators:
  pipe: {type: pipe, on: air, length: 0.8 m, ends: [closed, open], end_correction: 0 m}
  str: {type: string, on: wire, length: 0.5 m, ends: [fixed, fixed]}
given:
  - {fact: "frequency(str, harmonic=2) == frequency(pipe, harmonic=1)", source: stated}
observe:
  mass_g: "M in g"
  nearest_option: nearest(M, 5[g], 10[g], 20[g], 40[g])
