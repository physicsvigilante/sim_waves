id: B4/single/55
assume:
  - "Two identical wires (mu, L arbitrary) vibrating in their fundamental; wire 2 tension raised by 1 %. Unknown base tension is solved from the 3 beats in 2 s (1.5 Hz)."
arbitrary: {mu: 10 g/m, L: 0.5 m}
unknowns: {T: positive}
media:
  w1: {type: string, mu: mu, tension: T}
  w2: {type: string, mu: mu, tension: "1.01*T"}
resonators:
  r1: {type: string, on: w1, length: L, ends: [fixed, fixed]}
  r2: {type: string, on: w2, length: L, ends: [fixed, fixed]}
given:
  - {fact: "beat_frequency(frequency(r1, harmonic=1), frequency(r2, harmonic=1)) == (3/2)[Hz]", source: stated, note: "3 beats in 2 s"}
observe:
  f: "frequency(r1, harmonic=1)"
  option: "nearest(frequency(r1, harmonic=1), 150[Hz], 200[Hz], 300[Hz], 450[Hz])"
