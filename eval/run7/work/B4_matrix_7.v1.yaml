id: B4/matrix/7
assume:
  - "Single source: both trains have the same frequency, omega1 = omega2."
  - "Same cross-section area, same tension, string 2 four times heavier (density 4x): mu2 = 4 mu1."
  - "Both travel +x, phase 0. Numeric values for rho, area, tension, A, f arbitrary."
  - "Energy density per volume = per length / area (same area): ratio equals the ratio per length. Intensity = power/area with equal areas."
arbitrary: {rho: 8000 kg/m^3, a: 1e-6 m^2, T: 50 N, A0: 1 mm, f0: 100 Hz}
media:
  s1: {type: string, density: rho, area: a, tension: T}
  s2: {type: string, density: 4*rho, area: a, tension: T}
waves:
  y1: {harmonic: {on: s1, A: A0, f: f0, dir: +x, phase: 0}}
  y2: {harmonic: {on: s2, A: 2*A0, f: f0, dir: +x, phase: 0}}
given: []
observe:
  u_ratio: "mean_over(t, energy_density(y1, x=0[m], t=t), 0[s], period(y1)) / mean_over(t, energy_density(y2, x=0[m], t=t), 0[s], period(y2))"
  P_ratio: power(y1)/power(y2)
  I_ratio: (power(y1)/a)/(power(y2)/a)
  v_ratio: speed(y1)/speed(y2)
