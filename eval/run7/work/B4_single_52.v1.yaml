id: B4/single/52
assume:
  - "Bridge at dl from the centre splits the wire into l/2+dl and l/2-dl, both fixed-fixed fundamental. Wire properties and l arbitrary."
symbols: {dl: positive}
arbitrary: {mu: 10 g/m, L: 1 m}
media: {w: {type: string, mu: mu, tension: 100 N}}
resonators:
  r0: {type: string, on: w, length: L, ends: [fixed, fixed]}
  r1: {type: string, on: w, length: "L/2 + dl", ends: [fixed, fixed]}
  r2: {type: string, on: w, length: "L/2 - dl", ends: [fixed, fixed]}
given:
  - {fact: "dl < L/2", source: assumption, note: "bridge inside the wire"}
observe:
  coeff: "limit(beat_frequency(frequency(r1, harmonic=1), frequency(r2, harmonic=1))/(frequency(r0, harmonic=1)*dl/L), dl, 0)"
