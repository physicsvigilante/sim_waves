id: B4/comprehension/20
assume:
  - "The tube is a path: the two parts travel arcs of length pi*R/2 (shorter, S to D quarter circle) and 3*pi*R/2 (longer). Arc lengths are geometry read from the figure (holes at right angles)."
  - "Sound speed, frequency and R are not given: arbitrary. 'Maximum intensity' means the frequency is tuned to constructive interference; I take the path difference as one wavelength."
  - "Wave intensity I0 divided equally: each part is represented by a ray of equal amplitude from the same coherent source; I0 is the sum of the two parts' intensities (taken from two incoherent copies N1,N2 of the same amplitude)."
arbitrary: {R: 1 m}
unknowns: {f: positive}
media: {air: {type: gas, v: 340 m/s}}
sources:
  S: {on: air, f: f, A: 1, phase: 0, spreading: none}
  N1: {on: air, f: f, A: 1, phase: random, spreading: none}
  N2: {on: air, f: f, A: 1, phase: random, spreading: none}
rays:
  short: {from: S, length: "pi*R/2"}
  long: {from: S, length: "3*pi*R/2"}
  n1: {from: N1, length: "pi*R/2"}
  n2: {from: N2, length: "3*pi*R/2"}
given:
  - {fact: "path_difference(long, short) == wavelength(short)", source: assumption, note: "maximum intensity: constructive, path difference one wavelength (v1 rejected the open-ended phase condition)"}
observe:
  Imax_over_I0: "relative_intensity(short, long) / relative_intensity(n1, n2)"
  pathdiff: "path_difference(long, short)"
