id: B4/single/97
assume:
  - "Source radiates isotropically (spherical spreading) -- the problem does not say; 'sends out waves in air' taken as a point source in free space."
media: {air: {type: gas, v: 340 m/s, density: 1.29 kg/m^3}}
sources: {S: {on: air, at: [0 m, 0 m], power: 10 W, f: 1000 Hz, phase: 0, spreading: spherical}}
points: {P: [10 m, 0 m]}
rays: {r: {from: S, to: P}}
observe:
  A: "displacement_amplitude(r)"
  option: "nearest(displacement_amplitude(r), 0.62e-6[m], 4.2e-6[m], 1.6e-6[m], 0.96e-6[m])"
