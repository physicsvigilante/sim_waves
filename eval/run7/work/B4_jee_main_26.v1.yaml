id: B4/jee_main/26
assume:
  - "Speaker radiates uniformly in all directions (spherical spreading); not stated."
  - "Speed of sound arbitrary (irrelevant to intensity)."
unknowns: {d: positive}
arbitrary: {vs: 340 m/s}
media: {air: {type: gas, v: vs}}
sources:
  spk: {on: air, at: [0 m, 0 m], power: 2 W, phase: random, spreading: spherical}
points:
  P: ["d", 0 m]
rays:
  r: {from: spk, to: P}
given:
  - {fact: "sound_level(intensity(r)) == 120", source: stated}
observe:
  d_cm: "d in cm"
  option: nearest(d in cm, 30, 40, 10, 20)
