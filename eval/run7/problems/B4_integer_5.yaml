statement: A simple harmonic wave of amplitude 8 units travels along positive x-axis. At any given instant
  of time, for a particle at a distance of 10 cm from the origin, the displacement is +6 units and for
  a particle at a distance of 25 cm from the origin, the displacement is +4 units. Calculate the wavelength,
  in cm.
