id: B4/single/156
format: single_correct
statement: Two sound sources are moving in opposite directions with velocities v1 and v2 (v1 > v2). Both
  are moving away from a stationary observer. The frequency of both the sources is 900 Hz. For what value
  of v1 - v2 the beat frequency observed by the observer is 6 Hz. Given, speed of sound v = 300 ms^-1
  and v1 and v2 both << v.
figure: null
options:
  A: 1 ms^-1
  B: 2 ms^-1
  C: 3 ms^-1
  D: 4 ms^-1
