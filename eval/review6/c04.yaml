id: c04
media: {air: {type: gas, v: 340 m/s, density: 1.2 kg/m^3}}
sources:
  S1: {on: air, at: [0 m, 1 m], f: 170 Hz, power: 1 W, phase: 0, spreading: spherical}
reflectors: {wall: {point: [0 m, 0 m], normal: [0, 1], boundary: rigid}, soft: {point: [0 m, 0 m], normal: [0, 1], boundary: open}}
points: {P: [0 m, 3 m]}
rays: {d: {from: S1, to: P}, b: {from: S1, to: P, via: wall}, c: {from: S1, to: P, via: soft}}
observe:
  Id: "intensity(d)*16*pi"
  Ib: "intensity(b)*64*pi"
  tot: "intensity(d, b)*64*pi"
  totsoft: "intensity(d, c)*64*pi"
