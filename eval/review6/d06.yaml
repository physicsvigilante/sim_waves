id: d06
# n identical incoherent sources raise the level by 10 dB exactly: n = 10
unknowns: {n: positive}
media: {air: {type: gas, v: 340 m/s}}
sources: {S: {on: air, at: [0 m, 0 m], power: 1e-3 W, phase: random, spreading: hemispherical}}
points: {P: [5 m, 0 m]}
rays: {r: {from: S, to: P}}
given: [{fact: "sound_level(n*intensity(r)) - sound_level(intensity(r)) == 10", source: stated}]
observe: {n: "n"}
