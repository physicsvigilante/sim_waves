id: L1
# level falls by 6 dB on moving 10 m further from a point source: find the first distance
unknowns: {d: positive}
media: {air: {type: gas, v: 340 m/s}}
sources:
  S: {on: air, at: [0 m, 0 m], power: 1 W, phase: random, spreading: spherical}
points: {P: [d, 0 m], Q: ["d + 10[m]", 0 m]}
rays: {a: {from: S, to: P}, b: {from: S, to: Q}}
given:
  - {fact: "sound_level(intensity(a)) - sound_level(intensity(b)) == 6", source: stated}
observe: {d: "d"}
