id: c02
media: {air: {type: gas, v: 340 m/s, density: 1.2 kg/m^3}}
sources:
  S1: {on: air, at: [0 m, 0 m], power: 1 W, phase: 0, spreading: spherical}
  S2: {on: air, at: [0 m, 0 m], power: 1 W, phase: 0, spreading: spherical}
  R: {on: air, at: [0 m, 0 m], power: 1 W, phase: random, spreading: spherical}
points: {P: [2 m, 0 m]}
rays: {r1: {from: S1, to: P}, r2: {from: S2, to: P}, rr: {from: R, to: P}}
observe:
  one: "intensity(r1)*16*pi"
  two: "intensity(r1, r2)*16*pi"
  mix: "intensity(r1, rr)*16*pi"
  da: "displacement_amplitude(r1)"
  pa: "pressure_amplitude(r1)"
  f: "frequency(r1)"
