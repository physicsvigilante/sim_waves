id: m7/R1
answer:
  a: "1.2 mm"
  b: "3.0 mm, at x = 0.70 m"
solution: |
  1. Wave speed: v = sqrt(T/mu) = sqrt(10 / 0.025) = 20 m/s. In 10 ms the pulse moves
     d = v t = 0.20 m.
  2. Let f(u) be the initial shape: f = 30 (u - 0.40) mm for 0.40 <= u <= 0.60 (u in m,
     slope 6.0 mm / 0.20 m), f = 60 (0.70 - u) mm for 0.60 < u <= 0.70, 0 otherwise.
  3. Fixed end at L = 0.80 m (image method, r = -1):
     y(x, t) = f(x - v t) - f(2L - x - v t), for x <= L.
  4. (a) x = 0.76 m, v t = 0.20 m: incident argument 0.56 m -> f = 30(0.16) = 4.8 mm;
     reflected argument 1.60 - 0.76 - 0.20 = 0.64 m -> f = 60(0.06) = 3.6 mm, inverted.
     y = 4.8 - 3.6 = 1.2 mm.
  5. (b) At t = 10 ms the incident part on the real string occupies 0.60 m <= x <= 0.80 m
     with y_i = 30 (x - 0.60) mm (rising edge; its apex is exactly at the clamp).
     The reflected part is -f(1.40 - x), non-zero for 0.70 m <= x <= 0.80 m, where
     1.40 - x lies on the falling edge: y_r = -60 (x - 0.70) mm.
     For 0.60 <= x <= 0.70: y = 30 (x - 0.60), rising to 3.0 mm at x = 0.70.
     For 0.70 <= x <= 0.80: y = 30(x - 0.60) - 60(x - 0.70) = 24 - 30 x (x in m, y in mm),
     decreasing from 3.0 mm to 0 at the clamp (fixed-end condition satisfied).
     Hence the maximum displacement is 3.0 mm at x = 0.70 m.
  Verified twice on device: image-method evaluation (1.2 mm; max 3.0 mm at 0.70 m) and an
  independent finite-difference integration of the wave equation with a clamped end
  (same values).
conventions_used:
  - "x increases to the right; the pulse moves in +x; displacement y positive upward."
  - "Fixed end: reflection coefficient -1 (inverted reflection, image method)."
  - "Linear superposition of incident and reflected pulses; ideal non-dispersive string."
  - "Largest displacement taken as the maximum |y| over the real string (x <= 0.80 m)."
