id: m7/R3
answer:
  a: "0.117 s (7/60 s = 0.1167 s)"
  b: "1.73 m from A (1.726 m)"
solution: |
  1. mu(x) = mu0 + k x with mu0 = 0.010 kg/m, k = (0.040 - 0.010)/3.0 = 0.010 kg/m^2.
     Local speed v(x) = sqrt(T/mu(x)).
  2. Time: t(x) = integral_0^x dx'/v = (1/sqrt(T)) integral_0^x sqrt(mu0 + k x') dx'
     = [2/(3 k sqrt(T))] (mu(x)^{3/2} - mu0^{3/2}).
     Prefactor 2/(3 x 0.010 x 4) = 16.67 s m^{3/2} kg^{-3/2}.
  3. (a) mu(B)^{3/2} = 0.040^{1.5} = 0.008; mu0^{3/2} = 0.001.
     t_AB = 16.67 x 0.007 = 0.1167 s (= 7/60 s).
  4. (b) Half time: mu^{3/2} - 0.001 = 0.0035 -> mu^{3/2} = 0.0045 -> mu = 0.0045^{2/3}
     = 0.02726 kg/m. x = (0.02726 - 0.010)/0.010 = 1.726 m from A (beyond the midpoint
     since the pulse is fastest near A: 40 m/s at A, 20 m/s at B).
  Verified twice on device: closed form above and an independent numerical cumulative
  integral of dx/v (and a time-stepping check): t_AB = 0.11667 s, x(t_AB/2) = 1.7257 m.
conventions_used:
  - "x measured from A towards B; mu increases linearly with x."
  - "Tension uniform along the rope (horizontal, gravity neglected); v = sqrt(T/mu) locally."
  - "Travel time = integral of dx / v(x); partial reflections neglected."
