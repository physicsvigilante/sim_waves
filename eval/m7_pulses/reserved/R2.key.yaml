id: m7/R2
answer:
  a: "0.20 m"
  b: "x = 0.70 m"
  c: "1.78 mJ (1.7765e-3 J)"
solution: |
  1. Speeds: v1 = sqrt(18/0.020) = 30 m/s; v2 = sqrt(18/0.180) = 10 m/s.
     Impedances Z = sqrt(T mu): Z1 = 0.60 kg/s, Z2 = 1.80 kg/s, Z2/Z1 = 3.
  2. Amplitude coefficients (displacement): t = 2 Z1/(Z1 + Z2) = 0.50;
     r = (Z1 - Z2)/(Z1 + Z2) = -0.50.
  3. (a) The transmitted pulse lasts as long (in time) as the incident one passes the joint;
     the incident width 0.60 m takes 0.60/30 = 0.020 s, so the transmitted width is
     v2 x 0.020 s = 0.60 x (10/30) = 0.20 m.
  4. (b) The incident peak (x = -0.90 m) reaches the joint at 0.90/30 = 0.030 s. It then
     travels on the right string for 0.070 s at 10 m/s: x = 0.70 m. (The transmitted pulse
     occupies 0.60 m to 0.80 m at t = 0.10 s.)
  5. (c) Energy of a pulse on a string (kinetic + potential, equal for a travelling pulse):
     E = T * integral (dy/dx)^2 dx. Incident: E_i = T A^2 (pi/w)^2 (w/2) = T A^2 pi^2 / (2 w)
     = 18 x (4.0e-3)^2 x pi^2 / 1.20 = 2.369e-3 J.
     Transmitted fraction = (Z2/Z1) t^2 = 3 x 0.25 = 0.75 (check: r^2 = 0.25, sum 1).
     E_t = 0.75 x 2.369e-3 = 1.777e-3 J = 1.78 mJ.
     Direct check: transmitted pulse amplitude 2.0 mm, width 0.20 m:
     E_t = 18 x (2.0e-3)^2 x pi^2 / (2 x 0.20) = 1.777e-3 J.
  Verified twice on device: closed-form d'Alembert transmitted field (support 0.60-0.80 m,
  peak at 0.70 m, numerically integrated energy 1.7765e-3 J) and an independent
  finite-difference simulation of the two-string junction (transmitted amplitude 2.0 mm,
  peak at x = 0.70 m).
conventions_used:
  - "Joint at x = 0; t = 0 when the pulse is in the stated position; pulse moves in +x."
  - "Displacement transmission coefficient t = 2Z1/(Z1+Z2), Z = sqrt(T mu); continuity of y and slope at the joint."
  - "Pulse energy = total mechanical (kinetic + elastic) energy = T * integral of (dy/dx)^2 dx."
  - "Length of a pulse = extent along x of the region where y is non-zero."
