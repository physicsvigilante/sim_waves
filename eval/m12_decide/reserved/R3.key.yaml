id: R3
answer: A
solution: >
  Wind is along the propagation direction (siren to observer), so the ground-frame speed
  of sound is 340 + 10 = 350 m/s. The observer moves against the wave at 5 m/s, so the
  speed of the wavefront relative to him is 350 + 5 = 355 m/s. Wavelength (ground) =
  350/500 = 0.70 m, unchanged by the observer's motion; frequency heard = 355/0.70 =
  500 x 355/350 = 507.14 Hz, nearest 507 Hz. Option A.
checks:
  formula: "f = f0 (v + w + v_o)/(v + w)"
  python: "check_reserved.py: speed 355, frequency 507.1429 Hz"
