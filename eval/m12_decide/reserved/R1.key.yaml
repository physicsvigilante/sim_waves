answer: B
solution: >
  Classical (book) route: the approaching car receives f1 = f0 (c + 35)/(c - 25) and
  re-emits it as a moving source, so the patrol car receives f2 = f1 (c + 25)/(c - 35).
  To first order f2 = f0 (1 + 2 u/c) with closing speed u = 25 + 35 = 60 m/s. Beat = 2 u f0 / c = 2 x 60 x 10.5e9 / 3e8 = 4200 Hz = 4.2 kHz.
  Exact special relativity (patrol-car frame): beta = relativistic sum of 25 and 35 m/s
  over c; f2 = f0 (1 + beta)/(1 - beta); beat = 4202.9 Hz with c = 299792458 m/s,
  which also rounds to 4.2 kHz. Nearest option: B (others 2.1, 8.4, 1.4 kHz far away).
