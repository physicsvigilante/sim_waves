id: R4
answer: [A, C]
solution: >
  f_wire = (1/2L) sqrt(T/mu) = sqrt(T/0.01) = 10 sqrt(T) Hz, so f_wire runs from 200 Hz
  (T = 400 N) to 220 Hz (T = 484 N), passing 210 Hz at T = 441 N. Beat = |10 sqrt(T) - 210|.
  Case f_wire <= 210 (T <= 441): beat = 210 - 10 sqrt(T), max 10 at T = 400.
  Case f_wire >= 210 (T >= 441): beat = 10 sqrt(T) - 210, max 10 at T = 484.
  Both cases give beat <= 10 Hz (A true) and < 12 Hz (C true); at T = 400 N beat = 10 > 5
  (B false); at T = 484 N beat = 10 Hz, not 20 (D false).
checks:
  formula: "piecewise sign cases of |10 sqrt(T) - 210| on [400, 484]"
  python: "check_reserved.py: grid max 10.0, min ~0, value at 484 N = 10.0"
