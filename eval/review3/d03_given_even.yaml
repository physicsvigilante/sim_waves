id: d03
unknowns: {n: integer, L: positive}
media: {air: {type: gas, v: 340 m/s}}
resonators:
  p: {type: pipe, on: air, length: L, ends: [closed, open], end_correction: 0 m}
given:
  - {fact: "frequency(p, harmonic=n) == 340[Hz]", source: stated}
  - {fact: "frequency(p, harmonic=n+1) == 510[Hz]", source: stated}
observe: {n: "n", L: "L"}
