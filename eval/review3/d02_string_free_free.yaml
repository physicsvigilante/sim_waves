id: d02
symbols: {e: positive}
media: {air: {type: gas, v: 340 m/s}, wire: {type: string, mu: 0.01 kg/m, tension: 100 N, length: 3 m}}
resonators:
  s: {type: string, on: wire, length: 1 m, ends: [free, fixed]}
  o: {type: pipe, on: air, length: 1 m, ends: [open, open], end_correction: e}
  c: {type: pipe, on: air, length: 1 m, ends: [closed, closed], end_correction: 5 cm}
observe:
  f1: "frequency(s, harmonic=1)"
  f3: "frequency(s, harmonic=harmonic(s, overtone=1))"
  lo: "wavelength(o, harmonic=1)"
  fc: "frequency(c, harmonic=2)"
  ns: "node_spacing(s, harmonic=3)"
