id: c08
symbols: {A: positive}
media:
  a: {type: string, mu: 0.01 kg/m, tension: 9 N}
junctions:
  J: {at: 0 m, left: a, right: free}
  K: {at: -3 m, left: fixed, right: a}
waves:
  w: {harmonic: {on: a, A: A, f: 10 Hz, dir: +x}}
  back: {harmonic: {on: a, A: A, f: 10 Hz, dir: -x, phase: 0}}
  st: {sum: [back, back_reflected]}
  nest: {sum: [st, back]}
observe:
  amp: "amplitude(w_reflected)"
  nodeK: "max_over(t, abs(y(st, x=-3[m], t=t)))"
