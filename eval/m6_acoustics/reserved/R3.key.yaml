  a: "75.1 dB"
  b: "p0 = 0.163 Pa"
  c: "87.3 dB"
solution: |
  1. Individual intensities (spherical spreading):
     I1 = P1/(4 pi r1^2) = 0.020/(4 pi * 9.00) = 1.7684e-4 W/m^2 (82.48 dB alone)
     I2 = P2/(4 pi r2^2) = 0.080/(4 pi * 17.64) = 3.6090e-4 W/m^2 (85.57 dB alone)
  2. lambda = v/f = 340/425 = 0.800 m. Path difference 4.20 - 3.00 = 1.20 m = 1.5 lambda,
     phase difference phi = 2 pi (1.20/0.800) = 3 pi  -> destructive (cos phi = -1).
  3. Coherent: I = I1 + I2 + 2 sqrt(I1 I2) cos phi = (sqrt(I2) - sqrt(I1))^2
     = (0.018997 - 0.013298)^2 = 3.2481e-5 W/m^2.
     L = 10 log10(3.2481e-5/1e-12) = 75.12 dB.
  4. Pressure amplitudes: p_i = sqrt(2 rho v I_i): p1 = sqrt(2*1.20*340*1.7684e-4) = 0.37987 Pa,
     p2 = 0.54267 Pa. Resultant (opposite phase) p0 = 0.54267 - 0.37987 = 0.16280 Pa.
     Independent check by phasor sum |p1 e^{-ik r1} + p2 e^{-ik r2}| with k = 2 pi/0.8:
     0.16280 Pa, and p0^2/(2 rho v) = 3.2481e-5 W/m^2 agrees with step 3.
  5. Incoherent: intensities add, I = I1 + I2 = 5.3773e-4 W/m^2,
     L = 10 log10(5.3773e-4/1e-12) = 87.31 dB.
conventions_used:
  - "I0 = 1.0e-12 W/m^2, L = 10 log10(I/I0)"
  - "Point sources: I = P/(4 pi r^2)"
  - "Peak pressure amplitude: I = p0^2/(2 rho v)"
  - "(a),(b) coherent, sources in phase at emission: add pressure amplitudes with phase k*(r2-r1)"
  - "(c) incoherent: add intensities"
