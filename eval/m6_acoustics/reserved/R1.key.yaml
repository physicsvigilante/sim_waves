answer:
  a: "v = 1489 m/s (about 1.49 x 10^3 m/s)"
  b: "P = 393 W (about 3.93 x 10^2 W)"
  c: "p0 = 553 Pa (about 5.53 x 10^2 Pa)"
  d: "s0 = 1.44 x 10^-8 m; sound level = 104.0 dB"
solution: |
  1. Bulk modulus B = 1/beta = 1/(4.4e-10) = 2.2727e9 Pa.
     v = sqrt(B/rho) = sqrt(2.2727e9 / 1025) = 1489.06 m/s.
  2. Intensity at 25 m: I = I0 * 10^(L/10) = 1e-12 * 10^11 = 0.100 W/m^2.
     The source radiates into a hemisphere (floor absorbs, water only above), so
     I = P / (2 pi r^2)  =>  P = 0.100 * 2 pi * 25^2 = 392.70 W.
  3. I = p0^2 / (2 rho v)  =>  p0 = sqrt(2 * 1025 * 1489.06 * 0.100) = 552.50 Pa.
  4. At 50 m (twice the distance) I' = P/(2 pi 50^2) = 0.0250 W/m^2,
     level L' = 10 log10(0.025/1e-12) = 103.98 dB (= 110 - 20 log10 2).
     p0' = sqrt(2 rho v I') = 276.25 Pa.
     omega = 2 pi * 2000 = 12566.4 rad/s.
     s0' = p0' / (rho v omega) = 276.25 / (1025 * 1489.06 * 12566.4) = 1.4403e-8 m.
     Check: from I' = (1/2) rho v omega^2 s0'^2, s0' = sqrt(2 I'/(rho v omega^2)) = 1.4403e-8 m
     and p0 = rho v omega sqrt(2I/(rho v omega^2)) = 552.50 Pa (independent route agrees).
conventions_used:
  - "Sound level L = 10 log10(I/I0), I0 = 1.0e-12 W/m^2 (stated in problem, also used in water)"
  - "Hemispherical spreading: I = P/(2 pi r^2)"
  - "Amplitudes are peak (not rms): I = p0^2/(2 rho v), p0 = rho v omega s0"
  - "Liquid sound speed v = sqrt(B/rho), B = 1/compressibility (adiabatic)"
  - "No absorption; single source"
