answer:
  a: "Y = 6.99 x 10^10 Pa (about 7.0 x 10^10 N/m^2)"
  b: "v = 5.09 x 10^3 m/s (5089 m/s)"
  c: "f = 3.18 x 10^3 Hz (3180 Hz)"
  d: "L' = 0.800 m"
solution: |
  1. Area A = pi d^2/4 = pi (0.0100)^2/4 = 7.854e-5 m^2.
     Y = F L / (A dL) = 2000 * 1.20 / (7.854e-5 * 4.37e-4) = 6.9926e10 Pa.
  2. Density rho = m/(A L) = 0.2545 / (7.854e-5 * 1.20) = 2700.3 kg/m^3.
     v = sqrt(Y/rho) = sqrt(6.9926e10 / 2700.3) = 5088.76 m/s.
     Independent check: v^2 = Y/rho = (F L/(A dL)) * (A L/m) = F L^2/(m dL)
     = 2000 * 1.44 / (0.2545 * 4.37e-4)  =>  v = 5088.76 m/s.
  3. Clamped end = displacement node, free end = antinode: L = (2n-1) lambda/4,
     f_n = (2n-1) v/(4L) -> 1060.16 Hz, 3180.47 Hz, ...
     Second-lowest mode: f = 3 v/(4L) = 3 * 5088.76 / 4.80 = 3180.5 Hz.
  4. Free-free rod: fundamental f1' = v/(2L'). Set v/(2L') = 3v/(4L)
     => L' = 2L/3 = 0.800 m (numerically 5088.76/(2*3180.47) = 0.8000 m).
conventions_used:
  - "Clamped end is a displacement node, free end a displacement antinode"
  - "Longitudinal speed v = sqrt(Y/rho) (thin rod)"
  - "Static test gives Y = F L/(A dL); same Y used dynamically"
  - "'Second-lowest normal mode' = third harmonic 3v/(4L) for clamped-free"
