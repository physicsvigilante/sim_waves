  f2: {given: "cos(2*pi*100*t)", units: {x: m, t: s, y: m}}
  f3: {given: "cos(2*pi*101*t)", units: {x: m, t: s, y: m}}
observe:
  b12: "beat_frequency(99[Hz], 100[Hz])"
  b23: "beat_frequency(100[Hz], 101[Hz])"
  b13: "beat_frequency(99[Hz], 101[Hz])"
