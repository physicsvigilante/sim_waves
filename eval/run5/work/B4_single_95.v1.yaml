id: B4/single/95
assume:
  - "Both waves same frequency, one medium, one point; amplitudes (pressure) 1:3 so p2 = 3*p1. Intensity at minima = antiphase (definition of destructive interference); at maxima in phase, shown for comparison."
  - "Wave 1 intensity is I; ratios are taken to it."
symbols: {p1: positive}
media:
  air: {type: gas, v: 340 m/s, density: 1.29 kg/m^3}
waves:
  w1: {harmonic: {on: air, pressure_amplitude: p1, f: 500 Hz, dir: +x, phase: 0}}
  w2min: {harmonic: {on: air, pressure_amplitude: 3*p1, f: 500 Hz, dir: +x, phase: pi}}
  w2max: {harmonic: {on: air, pressure_amplitude: 3*p1, f: 500 Hz, dir: +x, phase: 0}}
  tmin: {sum: [w1, w2min]}
  tmax: {sum: [w1, w2max]}
observe:
  I_ratio_2_to_1: "intensity(w2max)/intensity(w1)"
  Imin_over_I: "intensity(tmin)/intensity(w1)"
  Imax_over_I: "intensity(tmax)/intensity(w1)"
