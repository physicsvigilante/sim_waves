id: B4/single/30
assume:
  - "An echo is 'not heard distinctly' when the round-trip delay equals the interval between drum beats (the usual reading of such problems); this is NOT stated and is an assumption."
  - "Interval = 60 s / rate: 1.5 s at 40 per minute, 1 s at 60 per minute."
  - "Speed of sound v is not given; it is solved together with the distance d."
  - "He moves nearer by 90 m, so d > 90 m."
unknowns: {d: positive, v: positive}
media:
  air: {type: gas, v: v}
given:
  - {fact: "d > 90[m]", source: stated, note: "he can move 90 m nearer"}
  - {fact: "travel_time(air, start=0[m], end=2*d) == 60[s]/40", source: assumption, note: "round trip 2d takes one drum interval at 40 per minute"}
  - {fact: "travel_time(air, start=0[m], end=2*(d - 90[m])) == 60[s]/60", source: assumption, note: "after moving 90 m nearer"}
observe:
  d: "d"
  v: "v"
