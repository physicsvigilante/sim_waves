id: B4/multiple/3
format: multiple_correct
statement: The displacement of a particle in a medium due to a wave travelling in the x-direction through
  the medium is given by y = a sin(αt − βx) where t is time in second, α and β are constants.
options:
  A: The frequency of the wave is α.
  B: The time period of the wave is 2π/α.
  C: The wavelength of the wave is 2π/β.
  D: The velocity of the wave is α/β.
