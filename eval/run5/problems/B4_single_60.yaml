id: B4/single/60
format: single_correct
statement: Two wires of radii r and 2r are welded together end to end. The combination is used as a sonometer
  wire and is kept under a tension T. The welded point is mid-way between the bridges. The ratio of the
  number of loops formed in the wires, such that the joint is a node when stationary vibrations are set
  up in the wires, is
options:
  a: 1/4
  b: 1/3
  c: 1/2
  d: 2/3
