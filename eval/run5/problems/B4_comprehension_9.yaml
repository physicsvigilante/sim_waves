id: B4/comprehension/9
format: single_correct
statement: 'Passage (Comprehension 3): The air column in a pipe closed at one end is made to vibrate in
  its second overtone by tuning fork of frequency 440 Hz. The speed of sound in air is 330 m/s. End corrections
  may be neglected. Let P0 denote the mean pressure at any point in the pipe and ΔP0 the maximum amplitude
  of pressure variation. Based on the above facts, answer the following question.


  Q9. The amplitude of the pressure variation (ΔP) at the middle of the column is given by'
options:
  A: ΔP = ±ΔP0
  B: ΔP = ±ΔP0/2
  C: ΔP = ±ΔP0/√2
  D: ΔP = ±√3 ΔP0/2
