id: B4/jee_advanced/10
format: single_correct
statement: In the experiment for the determination of the speed of sound in air using the resonance column
  method, the length of the air column that resonates in the fundamental mode, with a tuning fork is 0.1
  m. When this length is changed to 0.35 m, the same tuning fork resonates with the first overtone. Calculate
  the end correction.
options:
  A: 0.012 m
  B: 0.025 m
  C: 0.05 m
  D: 0.024 m
