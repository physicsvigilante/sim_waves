id: B4/single/30
format: single_correct
statement: A man standing in front of a mountain beats a drum at regular intervals. The rate of drumming
  is generally increased and he finds that the echo is not heard distinctly when the rate becomes 40 per
  minute. He then moves nearer to the mountain by 90 m and finds that echo is again not heard distinctly
  when the drumming rate becomes 60 per minute. The distance between the mountain and the initial position
  of the man is
options:
  a: 205 m
  b: 300 m
  c: 180 m
  d: 270 m
