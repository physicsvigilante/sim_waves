id: B4/jee_main/40
format: single_correct
statement: Two sitar strings, A and B, playing the note Dha are slightly out of tune and produce beats
  of frequency 5 Hz. The tension of the string B is slightly increased and the beat frequency is found
  to decrease by 3 Hz. If the frequency of A is 425 Hz, the original frequency of B is
options:
  A: 428 Hz
  B: 430 Hz
  C: 420 Hz
  D: 422 Hz
