id: B4/jee_main/3
format: single_correct
statement: A uniform thin rope of length 12 m and mass 6 kg hangs vertically from a rigid support and
  a block of mass 2 kg is attached to its free end. A transverse short-wave train of wavelength 6 cm is
  produced at the lower end of the rope. What is the wavelength of the wave train (in cm) when it reaches
  the top of the rope?
options:
  A: '9'
  B: '12'
  C: '6'
  D: '3'
