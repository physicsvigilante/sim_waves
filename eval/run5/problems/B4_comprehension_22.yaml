id: B4/comprehension/22
format: single_correct
statement: 'Passage (Comprehension 7): A narrow tube is bent in the form of circle of radius R as shown.
  Two small holes S and D are made in the tube at the positions right angles to each other. A source placed
  at S generates a wave of intensity I0 which is equally divided into two parts. One part travels along
  the longer path, while the other travels along the shorter path. Both the part waves meet at point D
  where a detector is placed. Based on above information, answer the following question.


  Q22. The maximum value of wavelength λ to produce a minimum at D is given by'
figure: Circular tube of radius R (centre marked, radius R drawn). Hole S on the left end of the horizontal
  diameter's level and hole D at the bottom of the circle, the two holes being at 90 degrees about the
  centre (dashed horizontal and vertical lines through the centre).
options:
  A: πR
  B: 2πR
  C: πR/2
  D: 3πR/2
