id: B4/single/66
format: single_correct
statement: The velocities of sound in an ideal gas at temperature T1 and T2 are found to be V1 and V2
  respectively. If the r.m.s. velocities of the molecules of the same gas at the same temperatures T1
  and T2 are v1 and v2, respectively, then
options:
  a: v2 = v1 (V1/V2)
  b: v2 = v1 (V2/V1)
  c: v2 = v1 sqrt(V2/V1)
  d: v2 = v1 sqrt(V1/V2)
