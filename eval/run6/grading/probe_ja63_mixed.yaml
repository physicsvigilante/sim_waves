id: probe/ja63_mixed
assume:
  - "Grader probe: S1 is 800 m from S2 when it emits (t=0); O is 600 m from S2 when it HEARS that sound (1000 m path, 100/33 s later)."
media:
  air: {type: gas, v: 330 m/s}
sources:
  S1: {on: air, at: [800 m, 0 m], velocity: [-30 m/s, 0 m/s], f: 120 Hz, A: 1, phase: 0, spreading: none}
  S2: {on: air, at: [0 m, 0 m], f: 120 Hz, A: 1, phase: 0, spreading: none}
points:
  O: {at: [0 m, "-600[m] - 10[m/s]*(1000/330)[s]"], velocity: [0 m/s, 10 m/s]}
rays:
  h1: {from: S1, to: O}
  h2: {from: S2, to: O}
observe:
  f1: "frequency(h1, emitted=0[s])"
  arr: "arrives_at(h1, emitted=0[s])"
  f2: "frequency(h2, t=(1000/330)[s])"
  beats: "beat_frequency(h1, h2, t=(1000/330)[s])"
