id: B4/comprehension/16
assume:
  - "Two identical bump pulses, one inverted, on one uniform string, launched toward each other at the same speed (statement of the passage)."
  - "Bump shape (half sine, 0.2 m wide, 1 cm high) and string mu, T kept symbolic (the answer is about zero vs non-zero)."
  - "The instant of zero net displacement is the instant their centres coincide: travel_time over the gap/2."
symbols: {mu: positive, T: positive}
media:
  rope: {type: string, mu: mu, tension: T}
waves:
  p1: {pulse: {on: rope, shape: "0.01*sin(pi*(x - 0.2)/0.2)*(step(x - 0.2) - step(x - 0.4))", units: {x: m, y: m}, dir: +x}}
  p2: {pulse: {on: rope, shape: "-0.01*sin(pi*(x - 0.6)/0.2)*(step(x - 0.6) - step(x - 0.8))", units: {x: m, y: m}, dir: -x}}
  total: {sum: [p1, p2]}
observe:
  t_meet: "travel_time(rope, start=0.3[m], end=0.5[m])"
  net_y: "y(total, x=0.45[m], t=travel_time(rope, start=0.3[m], end=0.5[m]))"
  net_peak: "peak(total, t=travel_time(rope, start=0.3[m], end=0.5[m]))"
  amp_p1: "amplitude(p1)"
  amp_p2: "amplitude(p2)"
  vy_p1: "vy(p1, x=0.45[m], t=travel_time(rope, start=0.3[m], end=0.5[m]))"
  vy_p2: "vy(p2, x=0.45[m], t=travel_time(rope, start=0.3[m], end=0.5[m]))"
  vy_net: "vy(total, x=0.45[m], t=travel_time(rope, start=0.3[m], end=0.5[m]))"
  vy_net_nonzero: "vy(total, x=0.45[m], t=travel_time(rope, start=0.3[m], end=0.5[m])) == 0"
  vy_p1_nonzero: "vy(p1, x=0.45[m], t=travel_time(rope, start=0.3[m], end=0.5[m])) == 0"
