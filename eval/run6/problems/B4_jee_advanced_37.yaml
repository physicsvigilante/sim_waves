format: multiple_correct
statement: '[JEE (Advanced) 2013] Two vehicles, each moving with speed u on the same horizontal straight
  road, are approaching each other. Wind blows along the road with velocity w. One of these vehicles blows
  a whistle of frequency f1. An observer in the other vehicle hears the frequency of the whistle to be
  f2. The speed of sound in still air is V. The correct statement(s) is (are)'
figure: null
options:
  A: If the wind blows from the observer to the source, f2 > f1
  B: If the wind blows from the source to the observer, f2 > f1
  C: If the wind blows from the observer to the source, f2 < f1
  D: If the wind blows from the source to the observer, f2 < f1
