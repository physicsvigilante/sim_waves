id: R2
answer: A
solution: |
  Horn frequency f0 unknown, car speed u unknown, observer at rest.
  Approaching: f_a = f0 v/(v - u) = 600; receding: f_r = f0 v/(v + u) = 500.
  Ratio: (v + u)/(v - u) = 600/500 = 1.2 -> v + u = 1.2 v - 1.2 u -> 2.2 u = 0.2 v -> u = v/11.
  u = 340/11 = 30.909 m/s = 30.909 * 3.6 = 111.27 km/h.
  Nearest option 111 km/h (A). Distances: A 0.27, B 3.27, C 10.7, D 11.3 km/h.
  (f0 = 2 f_a f_r/(f_a + f_r) = 545.45 Hz, not asked.)
checks:
