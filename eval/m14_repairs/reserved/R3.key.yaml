id: R3
answer: 4   # Hz per mm
solution: |
  f(L) = v/(2L). First pipe: f1 = 320/(2 * 0.20) = 800 Hz.
  Second pipe: f2 = 320/(2 (0.20 + dl)) = 160/(0.20 + dl).
  Beats b(dl) = 800 - 160/(0.20 + dl) = 800 dl/(0.20 + dl).
  K = lim_{dl -> 0} b/dl = 800/0.20 = 4000 Hz per metre = 4 Hz per mm.
  (Equivalently |df/dL| = v/(2 L^2) = 320/(2 * 0.04) = 4000 Hz/m.)
  Exact at dl = 1 mm: b = 3.980 Hz, consistent with K = 4.
checks:
  - method: formula (differential)
    detail: df/f = -dL/L -> b = f dl/L = 800 * (1 mm)/(200 mm) = 4 Hz per mm.
  - method: python (device)
    detail: (800-160/(0.2+1e-6))/1e-3 = 3.99998 -> 4; b(1 mm) = 3.9801 Hz
engine_features: [open pipe fundamental, beats, limit() on a bounded symbol (0 < dl <= 5 mm) as dl -> 0]
