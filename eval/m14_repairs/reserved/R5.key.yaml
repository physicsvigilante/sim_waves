id: R5
answer: [A, B]
solution: |
  Let v be the (unspecified) speed of sound, in m/s.
  P (open-open, 0.60 m): f_n = n v/(2 * 0.60) = n v/1.2;  fundamental v/1.2 = 0.8333 v.
  Q (closed, 0.25 m): f = (2m - 1) v/(4 * 0.25) = (2m - 1) v;  fundamental v, first overtone 3 v.
  A: v > 0.8333 v for every v > 0 -> true.
  B: v : v/1.2 = 1.2 = 6:5 -> true.
  C: second harmonic of P = 2 v/1.2 = 1.667 v, which is higher than v -> false.
  D: first overtone of Q = 3 v; third harmonic of P = 3 v/1.2 = 2.5 v; 3 v > 2.5 v -> false.
  Every comparison scales with v, so the answer does not depend on the speed of sound.
checks:
  - method: formula (ratios, v cancels)
    detail: "Q1/P1 = 1.2; P2/Q1 = 1.667; Q(first overtone)/P3 = 1.2"
  - method: python (device)
    detail: "for v in (1, 340, 340000): A True, ratio 1.2, C False, D False"
engine_features: [comparison over an arbitrary (unranged) sound speed, open and closed pipe harmonics]
