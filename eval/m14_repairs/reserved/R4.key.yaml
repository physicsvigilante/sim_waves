id: R4
answer: A
solution: |
  Write y = 4 sin(w t - k x + phi), w = 2 pi * 50 = 100 pi rad/s, k > 0 (travel in +x).
  Crest at x1 = 0.10 m, t = 0: -0.10 k + phi = pi/2 + 2 pi m.
  At x2 = 0.25 m, t = 0: y = 4 sin(-0.25 k + phi) = 0, and dy/dt = 400 pi cos(-0.25 k + phi) > 0,
    so -0.25 k + phi = 2 pi p (a multiple of 2 pi).
  Subtract: 0.15 k = pi/2 + 2 pi n, n = 0, 1, 2, ... (k > 0)
    -> lambda = 2 pi/k = 0.15/(1/4 + n) = 0.60/(1 + 4n) m: 0.60, 0.12, 0.0667, ... m.
  Bound lambda > 0.20 m leaves only n = 0: lambda = 0.60 m, k = 10 pi/3 rad/m.
  phi = 0.25 k (mod 2 pi) = 5 pi/6  -> y = 4 sin(100 pi t - (10 pi/3) x + 5 pi/6)  (A).
  Distractors: B is the n = 1 branch (k = 50 pi/3, phi = 0.25 k = 25 pi/6 = pi/6 mod 2 pi),
    which fits both point conditions but has lambda = 12 cm < 20 cm (excluded by the bound);
    C has the wrong phase (y(0.10, 0) = 4 sin(-pi/6) = -2 mm); D travels in -x and gives
    y(0.10, 0) = 4 sin(7 pi/6) = -2 mm.
checks:
  - method: formula (quarter wavelength)
    detail: crest at 10 cm and the point 15 cm ahead (in +x) at mean position and rising -> 15 cm = lambda/4 + n lambda; bound -> lambda = 60 cm; phi from the crest = pi/2 + k*0.10 = pi/2 + pi/3 = 5 pi/6.
  - method: python (device)
    detail: "A: y(0.1,0)=4.0, y(0.25,0)=0.0, rising True. B: y(0.1,0)=4.0, y(0.25,0)=0, rising True, lambda=0.12 m (excluded)."
engine_features: [unknown k and phase from two points off the origin, stated bound on wavelength selects one branch, option matching on the wave equation]
