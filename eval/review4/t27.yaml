# source phases: S1 leads by pi; equal paths -> cancel. maxima in tube length L: (L - 1)/lam + 1/2 integer -> L = 1.5, 2.5 in [1,3]
symbols: {L: positive}
media: {air: {type: gas, v: 340 m/s}}
sources:
  S1: {on: air, f: 340 Hz, A: 1, phase: pi, spreading: none}
  S2: {on: air, f: 340 Hz, A: 1, phase: 0, spreading: none}
rays:
  r1: {from: S1, length: 1 m}
  r2: {from: S2, length: L}
  r3: {from: S2, length: 1 m, phase_change: pi}
observe:
  mx: "maxima(r1, r2, vary=L, lo=1[m], hi=3[m])"
  A0: "resultant_amplitude(r1, r3)"
  bad: "maxima(r1, r2, vary=L, lo=3[m], hi=1[m])"
