media: {air: {type: gas, v: 340 m/s}}
sources:
  S1: {on: air, f: 170 Hz, A: 1 Pa, phase: 0, spreading: none}
  S2: {on: air, f: 170 Hz, A: 1 mm, phase: 0, spreading: none}
  S3: {on: air, f: 170 Hz, A: -1, phase: 90 deg, spreading: none}
rays:
  r1: {from: S1, length: 1 m}
  r2: {from: S2, length: 1 m}
  r3: {from: S3, length: 1 m}
observe: {A: "resultant_amplitude(r1, r2)", I: "relative_intensity(r1, r2)", a3: "amplitude(r3)", A13: "resultant_amplitude(r1,r3)"}
