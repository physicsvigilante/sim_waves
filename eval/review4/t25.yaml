symbols: {lam: positive}
media: {air: {type: gas, v: 340 m/s}}
sources: {S: {on: air, at: [0.1 m, 6.3 m], f: "340[m/s]/lam", A: 1, phase: 0.3, spreading: none}}
reflectors: {wall: {point: [4.2 m, 0 m], normal: [-1, 0.2], boundary: rigid}}
points: {P: [0 m, 0.7 m]}
rays:
  direct: {from: S, to: P}
  bounce: {from: S, to: P, via: wall}
observe:
  dp: "path_difference(bounce, direct)"
  mx: "maxima(bounce, direct, vary=lam, lo=0.5[m], hi=100[m])"
