media: {air: {type: gas, v: 340 m/s}}
sources: {S: {on: air, f: 340 Hz, A: 1, phase: 0, spreading: none, at: [0 m, 1 m]}}
reflectors: {wall: {point: [0 m, 0 m], normal: [0, 1], boundary: rigid}}
points: {P: [3 m, 1 m]}
rays:
  d: {from: S, to: P}
  b: {from: S, to: P, via: wall}
observe:
  I: "relative_intensity(d, b)"
explore:
  vary: {reflectors.wall.boundary: [rigid, open]}
