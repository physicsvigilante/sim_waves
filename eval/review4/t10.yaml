# unknown wall distance d: S(0,6) P(0,0) wall x=d; bounce - direct = 4 -> 2*sqrt(d^2+9) = 10 -> d = 4
unknowns: {d: positive}
media: {air: {type: gas, v: 340 m/s}}
sources: {S: {on: air, at: [0 m, 6 m], f: 85 Hz, A: 1, phase: 0, spreading: none}}
reflectors: {wall: {point: [d, 0 m], normal: [-1, 0], boundary: rigid}}
points: {P: [0 m, 0 m]}
rays:
  direct: {from: S, to: P}
  bounce: {from: S, to: P, via: wall}
given: [{fact: "path_difference(bounce, direct) == 4[m]", source: stated}]
observe: {d: d, ph: "wrap(phase_difference(bounce, direct))", A: "resultant_amplitude(bounce, direct)"}
