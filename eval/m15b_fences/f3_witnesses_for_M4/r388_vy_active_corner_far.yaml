# m15b round 1 R4 control: the same shape's active corner at u = 1 (the peak of 3 - |u - 1|) passes x = 1 m at t = 0: refused by the symbolic spelling
media: {rope: {type: string, mu: 10 g/m, tension: 1 N}}
waves:
  p: {pulse: {on: rope, shape: "0.01*max(0, 1 - abs(x), 3 - abs(x - 1))", units: {x: m, y: m}, dir: +x}}
observe: {v: "at(diff(y(p, x=1[m], t=t), t), t=0[s])"}
expect: {error: rejected, message: "a derivative is taken at a corner or jump"}
