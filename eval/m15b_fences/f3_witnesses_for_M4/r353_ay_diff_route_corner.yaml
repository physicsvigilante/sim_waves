# m15b F3 equivalent spelling: the second time derivative through diff and at, at the tip
media: {rope: {type: string, mu: 10 g/m, tension: 1 N}}
waves:
  p: {pulse: {on: rope, shape: "0.01*max(0, 1 - abs(x - 0.5)/0.1)", units: {x: m, y: m}, dir: +x}}
observe: {a: "at(diff(y(p, x=1.5[m], t=t), t, 2), t=0.1[s])"}
expect: {error: rejected, message: "a derivative is taken at a corner or jump"}
