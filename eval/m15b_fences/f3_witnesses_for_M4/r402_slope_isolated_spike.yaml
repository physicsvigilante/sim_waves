# m15b round 2 R7 (F3): 0.01*step(x)*step(-x) is 0.01 at u = x - 10t = 0 and 0 elsewhere: an isolated spike, where no slope, velocity or density exists (round 1 returned 0): slope refused
media: {rope: {type: string, mu: 10 g/m, tension: 1 N}}
waves:
  p: {pulse: {on: rope, shape: "0.01*step(x)*step(-x)", units: {x: m, y: m}, dir: +x}}
observe: {s: "slope(p, x=0[m], t=0[s])"}
expect: {error: rejected, message: "is a corner or jump of the shape"}
