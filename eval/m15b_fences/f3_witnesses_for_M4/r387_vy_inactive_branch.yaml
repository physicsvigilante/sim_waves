# m15b round 2 R4 (F3, coverage cost of the switching-point fence): shape max(0, 1 - |u|, 3 - |u - 1|) with
# u = x - 10t; at x = 0, t = 0 the |u| corner is inactive (the third branch, 2 + u, is the largest) and the
# true vy is -0.1 m/s, but the point is a switching point, so the fence refuses it (the precise rule is M4's;
# round 1 returned -0.1, and before that the direct spelling hit a recursion error). Beside it: r400
media: {rope: {type: string, mu: 10 g/m, tension: 1 N}}
waves:
  p: {pulse: {on: rope, shape: "0.01*max(0, 1 - abs(x), 3 - abs(x - 1))", units: {x: m, y: m}, dir: +x}}
observe: {v: "vy(p, x=0[m], t=0[s])"}
expect: {error: rejected, message: "is a corner or jump of the shape"}
