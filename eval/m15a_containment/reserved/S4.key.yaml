id: m15a/S4
acceptable:
  - values:
      peak_p: {value: "0.0529446", unit: m, tol: "0.1%"}
      where_p: {value: "0.55", unit: m, tol: "0.1%"}
      peak_h: {value: "1", unit: m}
  - LIMIT   # a stopped request under the time or memory limit (the whole request, any observable)
working: |
  Pulse p at t = 0: y(x) = 0.01 * sum_{k=0}^{11} exp(-((x - k/10)/0.3)^2). Centres 0, 0.1, ..., 1.1 are symmetric about 0.55 m.
  Each Gaussian has sigma = 0.3/sqrt(2) = 0.212 m, far larger than the spacing 0.1 m, so the Poisson-sum ripple is of order
  exp(-2 pi^2 sigma^2/0.1^2) = exp(-88): negligible. The sum is a single smooth hump, symmetric about x = 0.55 m, so its maximum
  is at x = 0.55 m (the only critical point, concave there).
  Offsets from 0.55 are +-0.05, +-0.15, ..., +-0.55 m. With u = offset/0.3, the exponent is ((2j+1)/6)^2, j = 0..5, each used twice:
    j=0: exp(-0.027778) = 0.972604
    j=1: exp(-0.25)     = 0.778801
    j=2: exp(-0.694444) = 0.499352
    j=3: exp(-1.361111) = 0.256376
    j=4: exp(-2.25)     = 0.105399
    j=5: exp(-3.361111) = 0.034697
  Sum = 2.647229. y_max = 0.01 * 2 * 2.647229 = 0.0529446 m (about 5.294 cm). Hand precision about 1e-6 absolute.
  Wave h at t = 0 is sin(1e17 (x - 1)): |y| reaches exactly 1 (at x - 1 = pi/(2e17) + n pi/1e17), so peak = 1 m.
  A peak position for p is a decimal (numerical peak) near 0.55; no tie.
purpose: "Time limit: a peak of a sum of 12 overlapping Gaussians (a numerical fallback, like r84) and of sin(1e17 x), which is a hard symbolic extreme. Either the right values or LIMIT (time); never a wrong value or a hang."
