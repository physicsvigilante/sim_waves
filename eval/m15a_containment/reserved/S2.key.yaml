id: m15a/S2
acceptable:
  - values:
      f_heard: {value: "2125/4", unit: Hz}
      lam_heard: {value: "16/25", unit: m}
      beats: {value: "125/4", unit: Hz}
working: |
  Source approaching a still listener: f' = f*v/(v - vs) = 500*340/(340 - 20) = 500*340/320 = 531.25 Hz = 2125/4 Hz.
  Wavelength in the air at the listener: (v - vs)/f = 320/500 = 0.64 m = 16/25 m (= 340/531.25).
  At t = 1 s the car is at -80 m, still before the listener (it would pass at 7.5 s), so the heard frequency
  is the same 531.25 Hz. Sound heard at t = 1 s left the car at te with 150 - 20 te = 340 (1 - te), te = 0.59375 s > 0, so it exists.
  The horn is heard at 500 Hz. Beat frequency = |531.25 - 500| = 31.25 Hz = 125/4 Hz.
purpose: "Finish fast: ordinary Doppler and beats scene (moving source, still listener)."
