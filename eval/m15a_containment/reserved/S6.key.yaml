id: m15a/S6
acceptable:
  - values:
      v_in: {value: "50", unit: "m/s"}
      v_out: {value: "25", unit: "m/s"}
      lam_in: {value: "2", unit: m}
      lam_out: {value: "1", unit: m}
      f_out: {value: "25", unit: Hz}
      A_out: {value: "1/50", unit: m}
      R: {value: "1/9"}
      T: {value: "8/9"}
      R_plus_T: {value: "1"}
      env_max: {value: "1/25", unit: m}
      env_min: {value: "1/50", unit: m}
      swr: {value: "2"}
      tt: {value: "2/25", unit: s}
      f_total: {value: "25", unit: Hz}
      pick: {value: "3"}
      chain: {value: "50", unit: "m/s"}
      deep: {value: "50", unit: "m/s"}
  - LIMIT   # acceptable only if the whole request is stopped by the time or memory limit; no partial values
working: |
  v1 = sqrt(100/0.04) = 50 m/s; v2 = sqrt(100/0.16) = 25 m/s. Impedances sqrt(T*mu): Z1 = sqrt(4) = 2, Z2 = sqrt(16) = 4 (kg/s).
  lambda1 = 50/25 = 2 m; lambda2 = 25/25 = 1 m; frequency unchanged, 25 Hz.
  r = (Z1 - Z2)/(Z1 + Z2) = -2/6 = -1/3; t = 2 Z1/(Z1 + Z2) = 4/6 = 2/3.
  Transmitted amplitude = 3 cm * 2/3 = 2 cm = 1/50 m. Reflected amplitude 1 cm.
  Power ~ Z * omega^2 * A^2 / 2: R = r^2 = 1/9; T = (Z2/Z1) t^2 = 2 * 4/9 = 8/9; R + T = 1.
  Standing wave on s1 (x < 0), k1 = 2 pi/2 = pi: y = A[sin(wt - kx) - (1/3) sin(wt + kx)]; phasor magnitude^2 = 1 + 1/9 - (2/3) cos(2kx).
  x = -1/2 m: kx = -pi/2, cos(-pi) = -1, magnitude^2 = 1 + 1/9 + 2/3 = 16/9, magnitude 4/3, amplitude 3 cm * 4/3 = 4 cm = 1/25 m.
  x = -1 m: kx = -pi, cos(-2 pi) = 1, magnitude^2 = 4/9, magnitude 2/3, amplitude 2 cm = 1/50 m (equal to the transmitted amplitude, by continuity at the junction pattern).
  swr = (1/25)/(1/50) = 2.
  tt = 2/50 + 1/25 = 0.04 + 0.04 = 0.08 s = 2/25 s.
  f_total: every point of the standing wave oscillates at 25 Hz.
  pick: inner nearest(2; 1, 3/2, 2, 3) = option 3 (exactly 2); outer nearest(3; 1, 2, 3, 4) = option 3. So 3.
  chain: min(50, 75) = 50; max(50, 25) = 50 m/s.
  deep: abs of a positive number twelve times: 50 m/s.
purpose: "Nesting: many (17) observables on one scene, with nearest inside nearest, max/min chains, 12 nested abs, maximum-over-time of a standing wave, travel time across a junction. Should finish normally; if the request is stopped the result is LIMIT for the whole request, never a partial or wrong value."
