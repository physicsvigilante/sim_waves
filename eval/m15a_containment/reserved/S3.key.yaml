id: m15a/S3
acceptable:
  - values:
      power: {value: "pi/25", unit: W, decimal: 0.1256637}
      level_B: {value: "80", unit: dB}
      ratio: {value: "100"}
working: |
  I0 = 1e-12 W/m^2. Level 100 dB: I_A = 1e-12 * 10^10 = 1e-2 W/m^2.
  Spherical: I = P/(4*pi*s^2); at s = 1 m, P = 4*pi*1e-2 = pi/25 W = 0.12566 W.
  At 10 m: I_B = P/(4*pi*100) = 1e-4 W/m^2, level = 10*log10(1e-4/1e-12) = 80 dB.
  Ratio I_A/I_B = (10/1)^2 = 100.
purpose: "Finish fast: ordinary intensity and decibel scene with an unknown power solved from a log fact."
