id: m15a/S5
acceptable:
  - values:
      n_modes: {value: "1000000000"}
      top: {value: "1000000000", unit: Hz}
      ident: {value: "True"}
  - LIMIT   # memory or time: a list of 1e9 modes, or the expansion of a degree-100 product in 5 variables
working: |
  v = sqrt(T/mu) = sqrt(4/1) = 2 m/s, L = 1 m, f_n = n*v/(2L) = n Hz (the stated fact f1 = 1 Hz agrees).
  Modes in [0.5, 1000000000.5] Hz: n = 1, 2, ..., 1000000000, so the count is 1e9 (the 1e9-th mode, 1e9 Hz, is inside; n = 1e9 + 1
  is at 1000000001 Hz, outside).
  top = f_{1e9} = 1e9 Hz.
  ident: with p = a + c + e and q = b + d: (p + q)(p - q) = p^2 - q^2, so ((p+q)^50 (p-q)^50) = (p^2 - q^2)^50 for all values: True.
  Expanding either side (5 variables, degree 100) is about C(104,4) = 4.6 million terms.
purpose: "Memory limit: a count over a list of a billion modes, and a very large symbolic expansion. True values are known; either they, or LIMIT (memory or time). Never a wrong count, a crash that exhausts the machine, or a surviving process."
