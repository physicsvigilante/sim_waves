id: m15a/S1
acceptable:
  - values:
      length: {value: "17/20", unit: m}
      f3: {value: "300", unit: Hz}
      lam3: {value: "17/15", unit: m}
      n_band: {value: "4"}
working: |
  Closed-open pipe, no end correction: f_n = n*v/(4L), n odd.
  f1 = v/(4L) = 100 Hz  ->  L = 340/(4*100) = 0.85 m = 17/20 m.
  f3 = 3*f1 = 300 Hz.
  lambda_n = 4L/n, so lambda_3 = 4*0.85/3 = 3.4/3 = 17/15 m (about 1.1333 m).
  Allowed frequencies are 100, 300, 500, 700, 900, 1100 ... Hz (odd multiples of 100).
  Those in [250, 1000] Hz: 300, 500, 700, 900 -> 4.
purpose: "Finish fast: ordinary pipe-mode scene with an unknown length solved from a stated fact. Must not hit any limit."
