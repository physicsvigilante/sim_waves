id: f4
media:
  s1: {type: string, mu: 0.01 kg/m, tension: 100 N}
  s2: {type: string, mu: 0.04 kg/m, tension: 100 N}
junctions: {J: {at: 2 m, left: s1, right: s2}}
waves:
  p: {pulse: {on: s1, shape: "0.01*max(0, 1 - abs(x - 2.5)/0.1)", units: {x: m, y: m}, dir: +x}}
  q: {pulse: {on: s2, shape: "0.01*max(0, 1 - abs(x - 1.5)/0.1)", units: {x: m, y: m}, dir: -x}}
  u: {pulse: {on: s1, shape: "0.01*max(0, 1 - abs(x - 1.95)/0.1)", units: {x: m, y: m}, dir: -x}}
observe:
  Ar: "amplitude(p_reflected)"
  Aq: "amplitude(q_reflected)"
  yp: "y(p, x=1.9[m], t=0[s])"
  yu: "y(u, x=1.9[m], t=0[s])"
  pku: "peak(u, t=0[s])"
