id: f1
symbols: {a: positive}
media:
  s1: {type: string, mu: 0.01 kg/m, tension: 100 N}
  s2: {type: string, mu: 0.04 kg/m, tension: 100 N}
junctions: {J: {at: 2 m, left: s1, right: s2}}
waves:
  p: {pulse: {on: s1, shape: "0.01*exp(-((x - a)/0.05)**2)", units: {x: m, y: m}, dir: +x}}
observe:
  Ar: "amplitude(p_reflected)"
  yr: "at(y(p_reflected, x=1.9[m], t=0[s]), a=2.1)"
