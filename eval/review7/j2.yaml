id: j2
media:
  a: {type: string, mu: 0.01 kg/m, tension: 100 N}
waves:
  p: {pulse: {on: a, shape: "0.01*exp(-((x - 0.5)/0.05)**2)", units: {x: m, y: m}, dir: +x}}
  q: {pulse: {on: a, shape: "0.02*exp(-((x - 1.5)/0.08)**2)", units: {x: m, y: m}, dir: -x}}
  s: {sum: [p, q]}
observe:
  apart: "peak(s, t=0[s])"
