id: R2
assume:
  - "Closed-pipe length Lc is unstated: arbitrary, constrained to 15 cm < Lc < 30 cm (one quarter to one half of 60 cm)."
  - "Both pipes are filled with air at 330 m/s (stated speed of sound)."
arbitrary:
  Lc: {value: 20 cm, above: 15 cm, below: 30 cm}
media:
  air: {type: gas, v: 330 m/s}
resonators:
  open: {type: pipe, on: air, length: 60 cm, ends: [open, open], end_correction: 0 m}
  closed: {type: pipe, on: air, length: Lc, ends: [closed, open], end_correction: 0 m}
given:
  - {fact: "speed(open) == 330[m/s]", source: stated}
observe:
  n1: "frequency(open, harmonic=1)"
  n2: "frequency(open, harmonic=2)"
  n3: "frequency(closed, harmonic=1)"
  A: "frequency(open, harmonic=2) > frequency(closed, harmonic=1) > frequency(open, harmonic=1)"
  B: "frequency(closed, harmonic=1) > frequency(open, harmonic=2) > frequency(open, harmonic=1)"
  C: "frequency(open, harmonic=2) > frequency(open, harmonic=1) > frequency(closed, harmonic=1)"
