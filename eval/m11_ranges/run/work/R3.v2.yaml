id: R3
assume:
  - "Source speed u unstated: arbitrary, below 340 m/s; answer must not depend on it."
  - "Road along x; source passes N=(0,0) at time 0 (emission time 0); observer at (0, 170 m), 170 m from N perpendicular to the road."
  - "Unknown emission time tau (real) at which the heard frequency is 680 Hz; the 'time after passing N' is the RECEPTION time of that sound, measured from the instant the source passes N (the question reads: when does the observer hear it, after the source is at N)."
arbitrary:
  u: {value: 100 m/s, below: 340 m/s}
unknowns: {tau: real}
media:
  air: {type: gas, v: 340 m/s}
sources:
  S: {on: air, at: [0 m, 0 m], velocity: ["u", 0 m/s], f: 680 Hz, A: 1, phase: 0, spreading: none}
points:
  O: [0 m, 170 m]
rays:
  r: {from: S, to: O}
given:
  - {fact: "frequency(r, emitted=tau*1[s]) == 680[Hz]", source: stated}
observe:
  tau: "tau"
  t_hear: "arrives_at(r, emitted=tau*1[s])"
  t_hear_ms: "arrives_at(r, emitted=tau*1[s])/1[ms]"
