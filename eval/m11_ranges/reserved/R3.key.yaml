id: R3
answer: 500
solution: |
  Received frequency f = f0 v/(v - u cos(theta)), theta = angle between the source velocity
  and the line from source to observer at the instant of emission. f = f0 requires
  cos(theta) = 0, i.e. the sound was emitted when the source was at N. That sound travels
  the distance d = 170 m to the observer, taking d/v = 170/340 s = 0.5 s = 500 ms after
  the source passes N, whatever the source speed u (0 < u < v).
checks:
  formula: "f = f0 iff cos(theta)=0 iff emission at N; delay = d/v = 500 ms"
  numerical: >
    check_reserved.py simulates emission times on a fine grid for u = 1, 20, 100, 200,
    300, 339 m/s, computes reception time te + r/v and received frequency both from the
    Doppler formula and from the numerical derivative f0 * dte/dtr; in every case f = f0
    exactly once, at reception time 0.500 s after the source passes N.
