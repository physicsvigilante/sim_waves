id: R2
answer: A
solution: |
  n1 = v/(2L) = 330/1.2 = 275 Hz; n2 = 2 n1 = 550 Hz.
  Closed pipe of length l, with L/4 < l < L/2 i.e. 0.15 m < l < 0.30 m:
  n3 = v/(4l) lies strictly between v/(4*0.30) = 275 Hz and v/(4*0.15) = 550 Hz.
  Hence n1 < n3 < n2 for every allowed l; order n2 > n3 > n1. D is wrong because the
  order does not depend on l within the stated range.
checks:
  formula: "n3 = v/(4l) is monotone in l; endpoints give exactly n1 and n2"
  numerical: >
    check_reserved.py sweeps l over (0.15, 0.30) m (200001 points): n2 > n3 > n1 at every
    point; n3 ranges from ~275.001 Hz to ~549.996 Hz.
