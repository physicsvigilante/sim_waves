id: R1
answer: [A, B, C]
solution: |
  f1 = f0 v/(v+u) (source receding), f2 = f0 v/(v-u) (wall receives f0 v/(v-u) and
  re-emits it at rest), f3 = f0 (v+u)/(v-u) (wall as stationary source, driver approaching).
  A: for 0 < u < v, v/(v-u) > 1 > v/(v+u). True for every u.
  B: 1/f1 + 1/f2 = [(v+u)+(v-u)]/(f0 v) = 2/f0, so f0 is the harmonic mean of f1, f2.
     True for every u.
  C: f3/f2 = (v+u)/v > 1. True for every u.
  D: beats = f2 - f1 = f0 * 2uv/(v^2 - u^2). This exceeds 50 Hz only when
     u > ~16.96 m/s (2uv/(v^2-u^2) = 0.1 gives u^2 + 6800 u - 115600 = 0, u = 16.958 m/s).
     It is true for some u and false for others, so it is NOT necessarily true.
checks:
  formula: "algebra above; D threshold u* = -10v + sqrt(101) v ~= 16.958 m/s"
  numerical: >
    check_reserved.py sweeps u over (0.001, 339.999) m/s (200001 points): A, B, C hold at
    every point; D holds at some points and fails at others (first true at u ~= 16.958 m/s).
