name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: engine
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: engine/requirements-dev.txt
      - name: Install the pinned environment
        run: pip install -r requirements-dev.txt
      - name: Regression (every scene, under the per-scene limits)
        run: python -m simwaves test tests/regression -j 4
      - name: Examples
        run: python -m simwaves test ../format/examples -j 4
      - name: Negative
        run: python -m simwaves test tests/negative -j 4
      - name: Export
        run: python tests/test_export.py
      - name: Containment
        run: python tests/test_limits.py
