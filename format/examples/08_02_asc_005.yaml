id: 22/02/asc_005
symbols: {A: positive, n: positive, lam: positive}
waves:
  w: {given: "A*cos(2*pi*n*t - 2*pi*x/lam)**2", units: {x: m, t: s, y: m}}
observe:                       # engine splits into offset A/2 + sinusoid
