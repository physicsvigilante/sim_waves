id: 11/03/013
# The faintest audible sound at 1 kHz: pressure and displacement amplitude from intensity.
media:
  air: {type: gas, v: 332 m/s, density: 1.3 kg/m^3}
waves:
  s: {harmonic: {on: air, f: 1000 Hz, intensity: 1e-12 W/m^2, dir: +x, phase: 0}}
observe:
  dP: "pressure_amplitude(s)"
  A: "displacement_amplitude(s)"
expect: {dP: {value: 2.94e-5, tol: 0.005}, A: {value: 1.1e-11, tol: 0.03}}
