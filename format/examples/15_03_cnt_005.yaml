id: 22/03/cnt_005
media:
  rope:
    type: string
    mass: 0.1 kg
    length: 2 m
    tension: 60 N
    ends: {left: driven, right: absorbing}      # 'extracted without reflection'
unknowns: {f: positive}
waves:
