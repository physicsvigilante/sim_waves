format: numerical
statement: |
  The faintest sound that the human ear can detect at frequency 1 kHz corresponds to an intensity of about 10^-12 Wm^-2. Determine the pressure amplitude and the maximum displacement associated with this sound assuming the density of the air = 1.3 kgm^-3 and velocity of sound in air = 332 ms^-1.
figure: null
options: null
answer: "(deltaP)_m = 2.94 x 10^-5 N m^-2; A = 1.1 x 10^-11 m"
answer_value: {deltaP_m: 2.94e-5, A: 1.1e-11}
units: "deltaP_m in N m^-2 (Pa); A in m"
verified: "deltaP_m = sqrt(2*1e-12*1.3*332) = 2.94e-5 Pa; A = deltaP_m/(rho v 2 pi f) = 2.94e-5/(1.3*332*2 pi*1000) = 1.08e-11 m, about 1.1e-11 m. Matches key."
kinds: [derived_medium]
physics: [sound_intensity, pressure_amplitude, displacement_amplitude]
notes: "Misprint in solution image: denominator printed as '2p x 10^3' where 2 pi x 10^3 is meant. Two-part question."
