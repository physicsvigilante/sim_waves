statement: |
  Equation of a transverse wave in a stretched string is given by y = 2 sin[2 pi (x/30 - t/0.01)], where y, x are in cm, t is in second. Calculate the amplitude, frequency, wavelength and wave velocity.
figure: null
options: null
answer: "A = 2 cm, f = 100 Hz, lambda = 30 cm, v = 3000 cm/s = 30 m/s"
answer_value: 30
