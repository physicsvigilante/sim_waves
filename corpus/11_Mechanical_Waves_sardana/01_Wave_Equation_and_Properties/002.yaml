format: numerical
statement: |
  A transverse harmonic wave of amplitude 0.02 m is generated at x = 0 at one end of a long horizontal string by a tuning fork of frequency 500 Hz. At a given instant of time, the displacement of the particle at x = 0 is zero, the displacement of a particle at x = 0.1 m is -0.01*sqrt(3) m and that of a particle at x = 0.8 m is 0.01*sqrt(3). Find the velocity of the wave.
figure: null
options: null
answer: "v = 150 m/s (k = 20 pi/3 rad/m, omega = 1000 pi rad/s)"
answer_value: 150
units: m/s
verified: "Matches key as one admissible value. With y = A sin(wt - kx + phi) and wt+phi = 0 at x=0: sin(0.1k) = sqrt3/2 and sin(0.8k) = -sqrt3/2. Solutions: k = 20pi/3 + 20 pi n (n=0,1,2,...) giving v = 1000pi/k = 150/(1+3n) m/s. k = 10pi/3 fails (sin(0.8k)=+sqrt3/2). So 150 m/s is the largest (n=0) of a family; unique only if lambda is taken as the longest consistent value."
kinds: [given_wavefunction, inverse_condition]
physics: [wave_speed, wavelength, phase, wave_number]
notes: |
  Problem is underdetermined (family v = 150/(1+3n)); book gives only n=0. Direction of travel not stated; solution assumes +x (wt - kx form). Solution does not show the solving steps for k.
