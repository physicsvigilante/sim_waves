format: numerical
statement: |
  A tube 1 m long is closed at one end. A stretched wire is placed near the open end. The wire is 0.3 m long and has a mass of 0.01 kg. It is held fixed at both ends and vibrates in its fundamental mode. It sets the air column in the tube into vibration at its fundamental frequency by resonance. Calculate the frequency of oscillation of the air column and tension in the wire if speed of sound in air is v = 330 m s^-1.
figure: null
options: null
answer: "f = 82.5 Hz; T = 81.675 N"
answer_value: {frequency: 82.5, tension: 81.675}
units: {frequency: Hz, tension: N}
verified: "f = 330/(4*1) = 82.5 Hz; mu = 0.01/0.3 kg/m; T = mu (2 l f)^2 = (0.01/0.3)(2*0.3*82.5)^2 = 0.03333*2450.25 = 81.675 N. Matches key."
kinds: [derived_medium, inverse_condition]
physics: [closed_pipe, resonance, string_fundamental, tension]
notes: "Consistent."
