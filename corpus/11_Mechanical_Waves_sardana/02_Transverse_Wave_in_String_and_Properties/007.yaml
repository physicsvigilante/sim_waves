statement: |
  One end of 12 m long rubber tube with a total mass of 900 g is fastened to a fixed support. A cord attached to the other and passes over a pulley and supports an object with a mass of 5 kg. The tube is struck a transverse blow at one end. Find the time required for the pulse to reach the other end. Take g = 9.8 m/s^2.
figure: null
options: null
answer: "t = 0.47 s"
answer_value: 0.47
units: s
verified: "Matches key. T = 5*9.8 = 49 N; mu = 0.9/12 = 0.075 kg/m; v = sqrt(49/0.075) = 25.56 m/s; t = 12/25.56 = 0.469 s."
