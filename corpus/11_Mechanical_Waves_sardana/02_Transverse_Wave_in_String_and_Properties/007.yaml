notes: "Problem text is split across the image with a gap (the figure is in the solution). Solution figure: vertical tube AB standing on the floor at A with B at its top; cord from B over a pulley hung from the ceiling to a hanging block m. Tube is taken as under tension mg and its own weight neglected."
