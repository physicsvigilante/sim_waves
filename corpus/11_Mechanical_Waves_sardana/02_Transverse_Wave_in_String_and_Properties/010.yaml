format: numerical
statement: |
  Two wires of different densities but same area of cross section are soldered together at one end and are stretched to a tension T. The velocity of a transverse wave in one wire is double of that in the second wire. Calculate the ratio of density of the first wire to that of the second wire.
figure: null
options: null
answer: "rho1/rho2 = 1/4 = 0.25"
answer_value: 0.25
units: dimensionless
verified: "Matches key. v = sqrt(T/(A rho)); v1 = 2 v2 gives rho1/rho2 = 1/4."
kinds: [ratio, derived_medium]
physics: [wave_speed, tension, density]
notes: Consistent.
