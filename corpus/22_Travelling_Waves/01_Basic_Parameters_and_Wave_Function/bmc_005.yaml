options:
  a: "The wave speed is same for the entire wave, while particle velocity is different for different points at a particular instant"
  b: "Wave speed depends upon property of the medium but not on the wave properties"
  c: "Wave speed depends upon both the properties of the medium and on the properties of wave"
  d: "Particle velocity depends upon properties of the wave and not on medium properties"
answer: [a, b, d]
kinds: [conceptual]
physics: [wave_speed, particle_velocity]
notes: |
  Conceptual. Option (d) as keyed is debatable (v_p = Aω cos(...) has no explicit medium
  dependence once A, ω are fixed). A simulation can illustrate (a) and (b) via parameter changes.
