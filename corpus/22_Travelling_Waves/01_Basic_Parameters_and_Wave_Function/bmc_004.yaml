number: 5
source: {problem: 22_Travelling_Waves/01_Basic_Parameters_and_Wave_Function/Problems/bmc_004.png, solution: 22_Travelling_Waves/01_Basic_Parameters_and_Wave_Function/Solutions/bmc_004.png}
format: multiple_correct
statement: |
  A simple harmonic progressive wave in a gas has a particle displacement y = a at time t = T/4
  at the origin of the wave, and a particle velocity of y is v' at the same instant but at a
  distance λ/4 from the origin. Here T and λ are time period and wavelength of the wave
  respectively. Choose the correct option(s). (Wave speed is v and at t = T/4 the particle at
  the origin is momentarily at rest.)
figure: null
options:
  a: "The amplitude of the wave is 2a"
  b: "The amplitude of the wave is a"
  c: "y = a sin[(v'/a)(t - x/v)]"
  d: "y = 2a cos[(v'/a)(t - x/v)]"
answer: [b, c]
answer_value: "A = a; y = a sin((v'/a)(t - x/v))"
kinds: [inverse_condition, equation_form, symbolic]
physics: [sinusoidal_wave, phase, particle_velocity]
notes: |
  Unknowns A, ω, δ in y = A sin(ωt - kx + δ) fixed by three conditions. Option (c) requires
  checking a candidate wavefunction for equality with the solved one.
