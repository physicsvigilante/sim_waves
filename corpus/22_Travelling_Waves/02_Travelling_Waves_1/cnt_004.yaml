statement: |
  A travelling wave is represented by y = a sin[4t - 0.02x]. x is in cm and t is in second.
  (i) Find the phase difference (in rad) between two particles located at a separation of
  Δx = 10 cm. (ii) Find the phase change (in rad) of a particular particle during an interval
  of Δt = 1.0 s.
