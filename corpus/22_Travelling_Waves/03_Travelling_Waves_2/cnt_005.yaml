statement: |
  A 2 m long rope has mass of 0.1 kg and tension of 60 N. A power source at one end sends a
  harmonic wave with an amplitude of 1 cm down the rope. The wave is extracted at the other end
  without any reflection. What is the frequency of the power source (in Hz), if the power
  transmitted is 100 W?
