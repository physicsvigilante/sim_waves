id: B4/single/152
number: 152
source: wanes_full.pdf book p.4.92 (page image p-092); key p.4.122 (p-122)
format: single_correct
statement: A standing wave is maintained in a homogeneous string of cross-sectional area a and density rho. It is formed by the superposition of two waves travelling in opposite directions given by the equation y1 = a sin(omega t - k x) and y2 = 2a sin(omega t + k x). The total mechanical energy confined between the sections corresponding to the adjacent antinodes is
figure: null
options:
  a: 3 pi s rho omega^2 a^2 / (2k)
  b: pi s rho omega^2 a^2 / (2k)
  c: 5 pi s rho omega^2 a^2 / (2k)
  d: 2 pi s rho omega^2 a^2 / (2k)
answer: c
answer_value: 5 pi s rho omega^2 a^2 / (2k)
units: null
verified: Length between adjacent antinodes = pi/k. Energy per unit length of a wave of amplitude A is (1/2) rho s omega^2 A^2; the cross terms integrate to zero over pi/k; E = (1/2) rho s omega^2 (a^2 + 4a^2)(pi/k) = 5 pi s rho omega^2 a^2/(2k). Matches key.
kinds:
- symbolic
- given_wavefunction
physics:
- standing_wave
- energy
notes: Statement text says cross-sectional area 'a' while the options use 's' for the area; amplitude symbol is also 'a'. Transcribed as printed; s is taken as the cross-sectional area.
