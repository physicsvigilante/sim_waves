id: B4/single/11
number: 11
source: book p.82-83 (answer key p.122)
format: single_correct
statement: Two loudspeakers L1 and L2, driven by a common oscillator and amplifier, are arranged as shown.
  The frequency of the oscillator is gradually increased from zero and the detector at D records a series
  of maxima and minima. If the speed of sound is 330 m/s then the frequency at which the first maximum
  is observed is
figure: L1 at top left and L2 directly below it, separated by 9 m (vertical). Detector D lies to the right
  of L1 on the same horizontal line, 40 m from L1 (dashed horizontal line L1-D). A dashed line joins L2
  to D.
options:
  A: 165 Hz
  B: 330 Hz
  C: 495 Hz
  D: 660 Hz
answer: B
answer_value: 330 Hz
units: Hz
verified: 'L1D = 40 m, L2D = sqrt(40^2 + 9^2) = 41 m, path difference 1 m. Sources in phase: maxima when
  path difference = n lambda; first (smallest nonzero frequency) maximum at lambda = 1 m -> f = 330 Hz.
  Matches key.'
kinds:
- numeric
- figure_geometry
physics:
- interference
- path_difference
notes: Taken as the first maximum at nonzero frequency.
