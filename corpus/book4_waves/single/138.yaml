source: wanes_full.pdf book p.4.91 (page image p-091); key p.4.122 (p-122)
format: single_correct
statement: The equation of a wave disturbance is given as y = 0.02 cos(pi/2 + 50 pi t) cot(10 pi x), where x and y are in metres and t in seconds. Select the incorrect statement.
figure: null
options:
  a: Antinode occurs at x = 0.3 m
  b: The wavelength is 0.2 m
  c: The speed of the constituent waves is 4 m s^-1
  d: Node occurs at x = 0.15 m
answer: c
answer_value: statement (c) is incorrect
units: null
verified: 'Nodes where cot(10 pi x)=0: x = 0.05 + 0.1 m -> 0.15 is a node (d true). Antinodes where cot diverges: x = 0, 0.1, 0.2, 0.3 (a true). Node spacing 0.1 -> lambda = 0.2 m (b true). f = 25 Hz -> v = 5 m/s, so (c) is false. Matches key.'
kinds:
- given_wavefunction
- classification
physics:
- standing_wave
- nodes
- antinodes
notes: The cot form is not a pure sinusoid in x; wavelength taken as twice node spacing.
