id: B4/single/64
number: 64
source: book p.86 (answer key p.122)
format: single_correct
statement: A tuning fork of frequency 340 Hz is vibrated just above a cylindrical tube of length 120 cm.
  Water is slowly poured in the tube. If the speed of sound in air is 340 m/s, then the minimum height
  of water required for resonance is
figure: null
options:
  A: 25 cm
  B: 45 cm
  C: 75 cm
  D: 95 cm
answer: B
answer_value: 45 cm
units: cm
verified: 'lambda = 100 cm; resonating air columns (closed at water): 25, 75 cm (125 too long). Minimum
  water height = 120 - 75 = 45 cm (the 25 cm column would need 95 cm of water, larger). Matches key.'
kinds:
- numeric
physics:
- resonance_tube
notes: Minimum water height corresponds to the longest resonating column.
