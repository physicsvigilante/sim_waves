verified: 'Closed first overtone = 3v/4Lc = open first overtone = v/Lo, so Lo = 4Lc/3. nth closed harmonic
  n v/4Lc = m v/2Lo = 3m v/8Lc gives n = 3m/2: (n, m) = (9, 6) among the options. Matches key.'
