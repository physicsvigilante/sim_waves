statement: In Melde's experiment, a string of length 0.8 m and mass 1.0 g vibrates in 4 segments when the tension in the string is 0.4 kgf. The tension in kgf required to make the string vibrate in 5 segments (same fork frequency) is
figure: null
options:
  a: 0.4 (4/5)
  b: 0.4 (4/5)^2
  c: 0.4 (5/4)
  d: 0.4 (5/4)^2
answer: b
answer_value: 0.4*(4/5)^2 = 0.256
units: kgf
verified: f fixed, f = (p/2L) sqrt(T/mu) -> T proportional to 1/p^2 -> T5 = 0.4 (4/5)^2. Matches key.
kinds:
- inverse_condition
- symbolic
physics:
- standing_wave
