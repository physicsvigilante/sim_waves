statement: '[Online 2017] Two wires W1 and W2 have the same radius r and respective densities ρ1 and ρ2
  such that ρ2 = 4ρ1. They are joined together at the point O, as shown in the figure. The combination
  is used as a sonometer wire and kept under tension T. The point O is midway between the two bridges.
  When a stationary wave is set up in the composite wire, the joint is found to be a node. The ratio of
  the number of antinodes formed in W1 to W2 is'
figure: A composite wire runs horizontally from a clamp on a wall at the left. W1 (density ρ1) is on the
  left and W2 (density ρ2) on the right, joined at point O (marked between them, midway between the two
  bridges). Two bridges (small triangles) support the wire, one at the left end of W1 and one at the right
  end of W2. The wire then passes over a pulley at the right and carries a hanging block that supplies
  the tension. No numbers on the figure.
options:
  A: '1 : 1'
  B: '1 : 2'
  C: '1 : 3'
  D: '4 : 1'
answer: B
answer_value: B
units: null
verified: 'Same radius so μ2 = 4μ1, v2 = v1/2. Equal lengths, same frequency: loops n = 2Lf/v, so n1/n2
  = v2/v1 = 1/2. Matches key.'
