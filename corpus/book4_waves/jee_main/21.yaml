id: B4/jee_main/21
number: 21
source: book p.109 (answer key p.123)
format: single_correct
statement: '[Online April 2019] A stationary source emits sound waves of frequency 500 Hz. Two observers
  moving along a line passing through the source detect sound to be of frequencies 480 Hz and 530 Hz.
  Their respective speeds are ...... in m/s. (Given speed of sound = 300 m/s)'
figure: null
options:
  A: 12, 16
  B: 16, 14
  C: 8, 18
  D: 12, 18
answer: D
answer_value: 12, 18
units: m/s
verified: 480 = 500 (300 - u1)/300 -> u1 = 12 (receding); 530 = 500 (300 + u2)/300 -> u2 = 18 (approaching).
  Matches key.
kinds:
- numeric
physics:
- doppler
notes: Consistent.
