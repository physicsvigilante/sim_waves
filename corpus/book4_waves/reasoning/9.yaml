verified: DISPUTED (judgement). For a moving observer the wavelength in the medium is unchanged (only
  frequency/received rate changes), so S2 is false; S1 is arguable (energy flux seen by the moving observer
  does change). On the textbook reading S1 true, S2 false, i.e. C. Book key says B.
