id: B4/jee_advanced/10
number: 10
source: "book p.113, JEE Advanced archive, single correct Q10 [IIT-JEE 2003]"
format: single_correct
statement: >-
  In the experiment for the determination of the speed of sound in air using the resonance column method, the length of the air column that resonates in the fundamental mode, with a tuning fork is 0.1 m. When this length is changed to 0.35 m, the same tuning fork resonates with the first overtone. Calculate the end correction.
figure: null
options:
  A: "0.012 m"
  B: "0.025 m"
  C: "0.05 m"
  D: "0.024 m"
answer: B
answer_value: 0.025
units: m
verified: "Matches key. (0.1+e) = lambda/4, (0.35+e) = 3 lambda/4, so 0.35 + e = 3(0.1 + e), e = 0.025 m."
kinds: [inverse_condition]
physics: [resonance column, end correction, closed pipe harmonics]
notes: "Option D is printed as '0.024 mg' in the book (unit misprint)."
