id: B4/jee_advanced/62
number: 62
source: "book p.119, JEE Advanced archive, matrix match Q3 (overall no. 62) [IIT-JEE 2011]"
format: matrix_match
statement: >-
  Column I shows four systems, each of the same length L, for producing standing waves. The lowest possible natural frequency of a system is called its fundamental frequency, whose wavelength is denoted as lambda_f. Match each system with statements given in Column II describing the nature and wavelength of the standing waves.
figure: "Column I entries each have a small sketch of the system spanning from 0 to L: (A) pipe closed at one end (a pipe drawn from x=0 to x=L); (B) pipe open at both ends (pipe from 0 to L); (C) stretched wire clamped at both ends (wire with clamps at 0 and L); (D) stretched wire clamped at both ends and at mid-point (clamps at 0 and L, plus a clamp/support at L/2, marked L/2). No other numbers."
options:
  A: "Pipe closed at one end"
  B: "Pipe open at both ends"
  C: "Stretched wire clamped at both ends"
  D: "Stretched wire clamped at both ends and at mid-point"
column_ii:
  p: "Longitudinal waves"
  q: "Transverse waves"
  r: "lambda_f = L"
  s: "lambda_f = 2L"
  t: "lambda_f = 4L"
answer:
  A: [p, t]
  B: [p, s]
  C: [q, s]
  D: [q, r]
answer_value: null
units: null
verified: "Matches key. Closed pipe: longitudinal, lambda_f = 4L. Open pipe: longitudinal, lambda_f = 2L. Clamped wire: transverse, lambda_f = 2L. Wire also clamped at midpoint: transverse, fundamental has a node at L/2 so lambda_f = L."
kinds: [classification, comparison]
physics: [standing waves, fundamental mode wavelength, boundary conditions]
notes: "Overall numbering: matrix section has 3 problems, 60-62. The book's key lists bubbles for A-D: A->(p,t), B->(p,s), C->(q,s), D->(q,r)."
