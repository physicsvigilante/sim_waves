verified: "Compression has higher pressure than rarefaction: (a) true, (b) false. dp = -B dy/dx = B a k cos(wt - kx): amplitude B a k, (c) true; it is cos vs sin, so pressure leads displacement by pi/2, (d) true. Matches key."
