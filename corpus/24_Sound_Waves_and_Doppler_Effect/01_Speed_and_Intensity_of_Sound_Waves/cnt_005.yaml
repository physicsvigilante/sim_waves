format: numerical
statement: |
  A gaseous mixture has 5 mol of nitrogen and 5 mol of hydrogen. Find the speed of sound in the mixture (in m/s) at 27 degC. Value of gamma for both nitrogen and hydrogen is 1.4. Value of gas constant R is 8.3 J/mol K.
figure: null
options: null
answer: "482"
answer_value: 482
units: m/s
verified: "M = (5*28 + 5*2)/10 = 15 g/mol = 0.015 kg/mol; T = 300 K; v = sqrt(1.4*8.3*300/0.015) = sqrt(2.324e5) = 482 m/s. Matches key."
