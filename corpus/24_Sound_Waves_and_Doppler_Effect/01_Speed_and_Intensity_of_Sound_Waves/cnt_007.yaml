format: numerical
statement: |
  In a liquid of density 9.0 g/cm^3, longitudinal waves with frequency 250 Hz have wavelength 8.0 m. Find the change in volume of a sample of the liquid if pressure on it is increased from 1 atm to 2 atm (in x 10^-3 %).
  (1 atm = 10^5 N/m^2)
figure: null
options: null
answer: "2.8"
answer_value: 2.8
units: "x 10^-3 percent"
verified: |
  DISPUTED (factor of 10). v = 250*8 = 2000 m/s; B = rho v^2 = 9000*4e6 = 3.6e10 Pa; dP = 1e5 Pa; dV/V = 1e5/3.6e10 = 2.78e-6. As a percentage this is 2.78e-4 %, i.e. 0.28 in units of 10^-3 %. The key's step '2.8e-6 x 100 = 2.8e-3 %' is an arithmetic slip; the key value 2.8 would correspond to 2.8e-3 % only if dV/V were 2.8e-5.
kinds: [derived_medium]
physics: [bulk_modulus, speed_of_sound, volumetric_strain]
notes: "Key value 2.8 is wrong by a factor of 10 (correct 0.28 in the requested units). Page carries heading 'Numerical type'."
