id: 23/01/cnt_004
number: 11
source: {problem: 23_Superposition_and_Standing_Waves/01_Superposition_and_Standing_Waves/Problems/cnt_004.png, solution: 23_Superposition_and_Standing_Waves/01_Superposition_and_Standing_Waves/Solutions/cnt_004.png}
format: numerical
statement: |
  A source of sound S and a detector D are placed at some distance from one another. A big cardboard is placed near the detector and perpendicular to the line SD as shown in figure. It is gradually moved away and it is found that the intensity changes from a maximum to a minimum as the board is moved through a distance of 20 cm. Find the frequency (in Hz) of the sound emitted. Velocity of sound in air is 336 m/s.
figure: |
  Horizontal line from a dot labelled S (left) to a dot labelled D (middle), continued as a dashed line from D to a tall vertical board (rectangle) at the right, perpendicular to the line. No dimensions or numbers are marked.
answer: "420"
answer_value: 420
units: Hz
verified: "Board moved 0.20 m changes path (to board and back) by 0.40 m = lambda/2, so lambda = 0.8 m, f = 336/0.8 = 420 Hz. Matches key."
kinds: [inverse_condition]
physics: [interference, reflection, path_difference, frequency]
notes: Solution is terse ("phi = 2 pi/lambda x 0.4 = pi") but correct.
