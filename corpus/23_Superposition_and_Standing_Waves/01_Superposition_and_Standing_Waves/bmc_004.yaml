verified: "Own computation (no book key available): y1 + y2 = 0 requires (2x-3t)^2 = (2x+3t-6)^2. Taking + sign gives t = 1 s for all x; taking - sign gives x = 3/2 m for all t. y1 is a function of (x - 1.5t) so moves toward +x; y2 is a function of (x + 1.5t - 3) so moves toward -x. So a, b, d are true, c false."
