statement: |
  Two coherent waves represented by
  y1 = A sin( 2*pi*x1/lambda - omega*t + pi/4 ) and
  y2 = A sin( 2*pi*x2/lambda - omega*t + pi/6 ) overlap.
  The two waves will produce
figure: null
options:
  a: "constructive interference at (x1 - x2) = 2 lambda"
  b: "constructive interference at (x1 - x2) = (23/24) lambda"
  c: "destructive interference at (x1 - x2) = 1.5 lambda"
  d: "destructive interference at (x1 - x2) = (11/24) lambda"
answer: [b, d]
answer_value: null
