verified: "Phase difference = 2*pi*(x1-x2)/lambda + pi/12. Constructive: (x1-x2) = (n - 1/24) lambda (so 23/24 ok, 2 not). Destructive: (x1-x2) = (n + 1/2 - 1/24) lambda = 11/24, 35/24, ... (1.5 = 36/24 not). Matches key."
