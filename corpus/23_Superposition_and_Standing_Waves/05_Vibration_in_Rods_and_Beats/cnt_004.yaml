format: numerical
statement: |
  Two identical sonometer wires have a fundamental frequency of 500 Hz, when kept under same tension. What percentage increase in the tension of one wire would cause an occurrence of 5 beats s^-1 when both wires vibrate together?
figure: null
answer: "2.0"
answer_value: 2.0
units: percent
verified: "f ~ sqrt(T), so dT/T = 2 df/f = 2*(5/500) = 0.02 = 2%. Exact: (1.01)^2 - 1 = 2.01%. Matches key."
kinds: [ratio, inverse_condition]
physics: [beats, sonometer, tension, approximation]
notes: Uses first-order approximation; exact value is 2.01 percent.
