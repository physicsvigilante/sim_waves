kinds: [conceptual]
physics: [beats, amplitude_modulation]
notes: |
  Consistent in substance. Strictly, the amplitude 2A|cos(pi (f1-f2) t)| varies at f1 - f2 in magnitude (the cos itself at (f1-f2)/2); the book accepts (d) as written. Particles vibrate at the mean frequency (f1+f2)/2, so (c) is false.
