statement: |
  When beats are produced by two waves of nearly the same frequency,
figure: null
options:
  a: "the beat frequency depends on the position, where the beats are heard"
  b: "the beat frequency decreases as time passes"
  c: "the particles vibrate simple harmonically with a frequency equal to the difference of the two frequencies"
  d: "the amplitude of vibration at any point changes simple harmonically with a frequency equal to the difference of the two frequencies"
answer: d
answer_value: null
