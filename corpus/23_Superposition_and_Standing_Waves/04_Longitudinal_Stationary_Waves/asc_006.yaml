source: {problem: 23_Superposition_and_Standing_Waves/04_Longitudinal_Stationary_Waves/Problems/asc_006.png, solution: 23_Superposition_and_Standing_Waves/04_Longitudinal_Stationary_Waves/Solutions/asc_006.png}
format: single_correct
statement: |
  An organ pipe is closed at one end has fundamental frequency of 1500 Hz. The maximum number of overtones generated by this pipe which a normal person can hear is:
figure: null
options:
  a: "14"
  b: "13"
  c: "6"
  d: "9"
answer: c
answer_value: 6
units: null
verified: "Audible limit 20000 Hz: (2N-1)*1500 <= 20000 gives 2N-1 <= 13.3, odd harmonics 1,3,...,13 are 7 modes, so 6 overtones. Matches key."
kinds: [inverse_condition]
physics: [closed_pipe, overtones, audible_range]
notes: Assumes audible limit 20 kHz (not stated in the problem; the solution supplies it). Solution writes N = 7.1 approx 7 (that is (2N-1) = 13.3, N = 7.17).
