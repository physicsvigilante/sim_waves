format: numerical
statement: |
  A sonometer wire resonates with a given tuning fork forming standing waves with five antinodes between the two bridges when a mass of 9 kg is suspended from the wire. When this mass is replaced by a mass M, the wire resonates with the same tuning fork forming three antinodes for the same positions of the bridges. Find the value of M (in kg).
figure: null
answer: "25"
answer_value: 25
units: kg
verified: "f = (p/2L) sqrt(Mg/mu) fixed: 5 sqrt(9) = 3 sqrt(M), M = 25 kg. Matches key."
kinds: [ratio, inverse_condition]
physics: [sonometer, standing_waves, tension, harmonics]
notes: Consistent.
