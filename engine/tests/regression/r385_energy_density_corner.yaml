# m15b round 1 R3 (F3): energy_density at the tip: refused (the velocity jumps there)
media: {rope: {type: string, mu: 10 g/m, tension: 1 N}}
waves:
  p: {pulse: {on: rope, shape: "0.01*max(0, 1 - abs(x - 0.5)/0.1)", units: {x: m, y: m}, dir: +x}}
observe: {e: "energy_density(p, x=1.5[m], t=0.1[s])"}
expect: {error: rejected, message: "has a corner along t"}
