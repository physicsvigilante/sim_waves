# m15b F1 control: circling listener, heard at 1 s: emitted at 3/4 s, frequency 500 Hz (constant distance)
media: {air: {type: gas, v: 340 m/s}}
sources:
  S: {on: air, at: [0 m, 0 m], f: 500 Hz, A: 1, phase: 0, spreading: none}
points:
  P: {at: [85 m, 0 m], circle: {center: [0 m, 0 m], speed: 17 m/s, sense: ccw}}
rays: {r: {from: S, to: P}}
observe:
  te: "emitted_at(r, t=1[s])"
  f: "frequency(r, t=1[s])"
expect: {te: 0.75, f: 500}
