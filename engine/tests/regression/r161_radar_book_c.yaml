# m12 run (R1 friction): the book's rounded c (c: 3e8 m/s), microseconds, speed(em); radar beat between echo and transmitted signal
assume:
  - "Road is the scene frame; patrol car at origin moving +x, target car ahead moving -x (approaching head-on), modelled as a rigid plane reflector moving along its normal."
  - "Initial separation is not stated; it is arbitrary (answer must not depend on it)."
  - "The mixed transmitted signal has the radar's own emitted frequency 10.5 GHz."
  - "Engine fixes c = 299792458 m/s exactly (v=3e8 is refused as above c); difference from the problem 3e8 is 0.07 percent and cannot change the nearest option."
arbitrary: {D: 3 km}
media: {space: {type: em, c: 3e8 m/s}}
sources:
  gun: {on: space, at: [0 m, 0 m], velocity: [25 m/s, 0 m/s], f: 10.5 GHz, A: 1, phase: 0, spreading: none}
points:
  P: {at: [0 m, 0 m], velocity: [25 m/s, 0 m/s]}
reflectors:
  car: {point: [D, 0 m], normal: [-1, 0], boundary: rigid, velocity: [-35 m/s, 0 m/s]}
rays:
  echo: {from: gun, to: P, via: car}
observe:
  fe: "frequency(echo, t=100[us])"
  beat: "beat_frequency(frequency(echo, t=100[us]), frequency(gun))"
  pick: "nearest(beat_frequency(frequency(echo, t=100[us]), frequency(gun)), 2.1[kHz], 4.2[kHz], 8.4[kHz], 1.4[kHz])"
  c: "speed(space)"
expect: {beat: "3024000000000000000/719999856000007", pick: 2, c: 300000000}
