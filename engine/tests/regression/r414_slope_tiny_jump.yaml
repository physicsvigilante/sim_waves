# m15b round 2 R9 (F3): 1e-31*step(x) has an exact jump smaller than the old 1e-30 tolerance: slope at 0 refused
media: {rope: {type: string, mu: 10 g/m, tension: 1 N}}
waves:
  p: {pulse: {on: rope, shape: "1e-31*step(x)", units: {x: m, y: m}, dir: +x}}
observe: {s: "slope(p, x=0[m], t=0[s])"}
expect: {error: rejected, message: "is a corner or jump of the shape"}
