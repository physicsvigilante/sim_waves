# m15b F4 valid neighbour: without emits_from the source always sounds: phase at 0.5 s = 500 pi - 1000 pi = -500 pi
media: {air: {type: gas, v: 340 m/s}}
sources:
  S: {on: air, at: [0 m, 0 m], f: 500 Hz, A: 1, phase: 0, spreading: none}
points: {P: [340 m, 0 m]}
rays: {r: {from: S, to: P}}
observe:
  ph: "phase(r, t=0.5[s])"
  f: "frequency(r, t=0.5[s])"
expect: {ph: "-500*pi", f: 500}
