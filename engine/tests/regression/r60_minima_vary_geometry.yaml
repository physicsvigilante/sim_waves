# run 4 (11/04/010): minima while varying a distance that moves source and detector
symbols: {d: positive}
media: {air: {type: gas, v: 360 m/s}}
sources: {S: {on: air, f: 180 Hz, A: 1, phase: 0, spreading: none, at: [-d, 0 m]}}
reflectors: {wall: {point: [0 m, 0 m], normal: [-1, 0], boundary: rigid}}
points: {D: [-d, 3 m]}
rays:
  direct: {from: S, to: D}
  bounce: {from: S, to: D, via: wall}
observe: {first: "min(minima(bounce, direct, vary=d, lo=2.001[m], hi=6[m]))"}
expect: {first: "3*sqrt(3)/2"}
