# m14 review round 16 (R2), control: at t = 1 s, x = 2 m the shape is taken at x - vt = 1: exp(-1)
media:
  rope: {type: string, mu: "1 kg/m", tension: "1 N"}
waves:
  p: {pulse: {on: rope, shape: "exp(-x**2) + log(x) - log(x)", units: {x: m, y: m}, dir: +x}}
observe: {ok: "y(p, x=2[m], t=1[s])"}
expect: {ok: "exp(-1)"}
