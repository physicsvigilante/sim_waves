# m10 review: a wall that has moved past the listener gives no echo
media: {air: {type: gas, v: 340 m/s}}
sources: {S: {on: air, at: [0 m, 0 m], f: 500 Hz, A: 1, phase: 0, spreading: none}}
points: {O: [50 m, 0 m]}
reflectors: {wall: {point: [200 m, 0 m], normal: [-1, 0], boundary: rigid, velocity: [-5 m/s, 0 m/s]}}
rays: {e: {from: S, to: O, via: wall}}
observe: {late: "frequency(e, t=35[s])"}
expect: {error: rejected, message: "echo does not exist"}
