# m15b F4: an echo from a rigid wall 170 m away comes back after 340/340 = 1 s; its phase at 0.5 s is refused
media: {air: {type: gas, v: 340 m/s}}
sources:
  S: {on: air, at: [0 m, 0 m], f: 500 Hz, A: 1, phase: 0, spreading: none, emits_from: 0 s}
reflectors:
  wall: {point: [170 m, 0 m], normal: [-1, 0], boundary: rigid}
points: {P: [0 m, 1 m]}
rays: {e: {from: S, to: P, via: wall}}
observe: {ph: "phase(e, t=0.5[s])"}
expect: {error: rejected, message: "no sound yet"}
