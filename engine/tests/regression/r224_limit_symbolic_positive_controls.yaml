# m14 review rounds 5 and 7, controls with numbers (a symbol other than the variable is refused, r221-r223):
# 1/q -> 1/2 at q = 2; |q|/q -> 1 at q = 2 (q near 2 is positive); 2q/(2q) = 1 for q != 0, so 1 at q -> 0
symbols: {q: real}
observe:
  pole_free: "limit(1/q, q, 2)"
  jump_free: "limit(abs(q)/q, q, 2)"
  cancel: "limit(2*q/(2*q), q, 0)"
expect: {pole_free: 0.5, jump_free: 1, cancel: 1}
