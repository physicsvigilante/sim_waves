# m15b F1 property test: listener on a circle NOT centred on the source (centre [100 m, 0], radius 30 m, 10 m/s); emitted at 0.3 s it hears at t with 340 (t - 0.3) = |P(t)|: t = 0.6806097285314530322370542589 (independent mpmath root); the round trip returns 0.3 s
media: {air: {type: gas, v: 340 m/s}}
sources:
  S: {on: air, at: [0 m, 0 m], f: 500 Hz, A: 1, phase: 0, spreading: none}
points:
  P: {at: [130 m, 0 m], circle: {center: [100 m, 0 m], speed: 10 m/s, sense: ccw}}
rays: {r: {from: S, to: P}}
observe:
  t1: "arrives_at(r, emitted=0.3[s])"
  back: "emitted_at(r, t=arrives_at(r, emitted=0.3[s]))"
expect: {t1: {value: 0.680609728531453032237054258904, tol: 1e-20}, back: {value: 0.3, tol: 1e-20}}
