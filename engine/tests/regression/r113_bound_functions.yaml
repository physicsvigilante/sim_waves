# m9 run (R2 friction): at(), diff() and resonances(vary=) accept a bounded symbol
symbols: {L: positive}
media: {air: {type: gas, v: 340 m/s}}
resonators: {p: {type: pipe, on: air, length: L, ends: [closed, open], end_correction: 0 m}}
given: [{fact: "L > 0.40[m]", source: stated}]
observe:
  d: "diff(250[Hz] - frequency(p, harmonic=1), L)"
  a: "at(frequency(p, harmonic=3), L=2[m])"
  r: "count(resonances(p, f=250[Hz], vary=L, lo=0.1[m], hi=3[m]))"
expect: {d: "85/L**2", a: 127.5, r: 3}
