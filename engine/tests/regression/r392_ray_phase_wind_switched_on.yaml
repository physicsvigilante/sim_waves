# m15b round 1 R6 (F4): in a 20 m/s wind the delay to 360 m is 1 s (phase at 1.1 s would be 100 pi, not 700 pi/17); a ray in moving air has no phase in v0: refused
media: {air: {type: gas, v: 340 m/s, wind: [20 m/s, 0 m/s]}}
sources:
  S: {on: air, at: [0 m, 0 m], f: 500 Hz, A: 1, phase: 0, spreading: none, emits_from: 0 s}
points: {P: [360 m, 0 m]}
rays: {r: {from: S, to: P}}
observe: {ph: "phase(r, t=1.1[s])"}
expect: {error: rejected, message: "the air moves"}
