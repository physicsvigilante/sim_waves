# review 3 #3: a vary symbol the resonator ignores is an error, not "0 resonances"
symbols: {q: positive}
media: {air: {type: gas, v: 340 m/s}}
resonators: {p: {type: pipe, on: air, length: 0.5 m, ends: [closed, open], end_correction: 0 m}}
observe: {n: "count(resonances(p, f=170[Hz], vary=q, lo=0[m], hi=1[m]))"}
expect: {error: rejected, message: "depend on q"}
