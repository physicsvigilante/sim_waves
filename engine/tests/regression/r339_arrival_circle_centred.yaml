# m15b F1 (D3-6): a listener circling the still source at 85 m hears the sound emitted at 0 at 85/340 = 1/4 s (was 1 s: the arrival bisection moved the wrong end)
media: {air: {type: gas, v: 340 m/s}}
sources:
  S: {on: air, at: [0 m, 0 m], f: 500 Hz, A: 1, phase: 0, spreading: none}
points:
  P: {at: [85 m, 0 m], circle: {center: [0 m, 0 m], speed: 17 m/s, sense: ccw}}
rays: {r: {from: S, to: P}}
observe: {arrival: "arrives_at(r, emitted=0[s])"}
expect: {arrival: 0.25}
