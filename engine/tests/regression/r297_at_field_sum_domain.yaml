# m14 review round 17 (H1): at(field(total), ...) takes the sum's written conditions at the point: the part
# log(x - t) - log(x - t) is undefined at x - t = -1, so refused (before: exp(-1))
waves:
  cut: {given: "log(x-t) - log(x-t)", units: {x: m, t: s, y: m}}
  smooth: {given: "exp(-(x-t)**2)", units: {x: m, t: s, y: m}}
  total: {sum: [cut, smooth]}
observe: {bad: "at(field(total), x=-1[m], t=0[s])"}
expect: {error: rejected, message: "not defined at these values"}
