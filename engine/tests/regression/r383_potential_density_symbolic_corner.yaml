# m15b round 1 R3 (F3): at(potential_density(p, x=x, t=0.1), x = 1.5 m) is at the triangle's tip, where the slope jumps +-0.1: refused (was 0.005 J/m; the direct spelling was already refused)
media: {rope: {type: string, mu: 10 g/m, tension: 1 N}}
waves:
  p: {pulse: {on: rope, shape: "0.01*max(0, 1 - abs(x - 0.5)/0.1)", units: {x: m, y: m}, dir: +x}}
observe: {u: "at(potential_density(p, x=x, t=0.1[s]), x=1.5[m])"}
expect: {error: rejected, message: "a derivative is taken at a corner or jump"}
