# m8: standing wave, kinetic energy between nodes: maximum pi k A^2 T, average over a period half of it (11/05/009)
symbols: {A: positive}
media: {s: {type: string, mu: 0.01 kg/m, tension: 4 N}}
waves:
  w1: {harmonic: {on: s, A: A, f: 10 Hz, dir: +x, phase: 0}}
  w2: {harmonic: {on: s, A: A, f: 10 Hz, dir: -x, phase: pi}}
  st: {sum: [w1, w2]}
observe:
  K_max: "kinetic_energy(st, start=0[m], end=wavelength(w1)/2, t=1/(4*frequency(w1)))"
  formula: "pi*k(w1)*A**2*tension(s)"
  K_avg: "mean_over(t, kinetic_energy(st, start=0[m], end=wavelength(w1)/2, t=t), 0[s], period(w1))"
expect: {K_max: "4*pi**2*A**2", formula: "4*pi**2*A**2", K_avg: "2*pi**2*A**2"}
