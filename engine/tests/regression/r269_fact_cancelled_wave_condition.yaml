# m14 review round 14 (K15): y(p, x=d) - y(p, x=d) cancels, but the written logs need d > 0; the conditions are
# recorded beside the fact before SymPy cancels anything, so d = -1 is no solution: inconsistent (before: d = -1)
unknowns: {d: real}
waves:
  p: {given: "log(x-t) - log(x-t)", units: {x: m, t: s, y: m}}
given:
  - "y(p, x=d, t=0[s]) - y(p, x=d, t=0[s]) + d == -1[m]"
observe: {d_solved: "d"}
expect: {error: rejected, message: "no situation satisfies the facts"}
