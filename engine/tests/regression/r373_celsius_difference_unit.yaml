# m15b F6 valid neighbour: 1/degC inside a compound unit is a temperature difference, like 1/K: v = sqrt(Y alpha dT / rho) = sqrt(1.3e11 * 1.7e-5 * 20 / 9000) = 70.0793... m/s for both
media:
  k: {type: string, density: 9000 kg/m^3, Y: 1.3e11 Pa, alpha: 1.7e-5 1/K, tension: {thermal: {slack_at: 30 degC, now: 10 degC}}}
  c: {type: string, density: 9000 kg/m^3, Y: 1.3e11 Pa, alpha: 1.7e-5 1/degC, tension: {thermal: {slack_at: 30 degC, now: 10 degC}}}
observe:
  vk: "speed(k)"
  vc: "speed(c)"
expect: {vk: {value: "sqrt(1.3e11*1.7e-5*20/9000)", tol: 1e-12}, vc: {value: "sqrt(1.3e11*1.7e-5*20/9000)", tol: 1e-12}}
