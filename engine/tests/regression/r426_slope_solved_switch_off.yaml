# m15b round 3 R13 (F3): 0.01|x - a| with a solved to 1: slope +0.01 at 2 m, -0.01 at 0, and +0.01 by the symbolic spelling (the direct ones were refused: the switch was classified before the solution)
unknowns: {a: real}
waves:
  w: {given: "0.01*abs(x-a)", units: {x: m, t: s, y: m}}
given:
  - {fact: "a == 1", source: stated}
observe:
  s1: "slope(w, x=2[m], t=0[s])"
  s2: "slope(w, x=0[m], t=0[s])"
  s3: "at(slope(w, x=x, t=0[s]), x=2[m])"
expect: {s1: 0.01, s2: -0.01, s3: 0.01}
