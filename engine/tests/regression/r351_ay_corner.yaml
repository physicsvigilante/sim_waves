# m15b F3 (D3-1): ay at the triangle's tip is refused (vy jumps from +1 to -1 m/s; was 0)
media: {rope: {type: string, mu: 10 g/m, tension: 1 N}}
waves:
  p: {pulse: {on: rope, shape: "0.01*max(0, 1 - abs(x - 0.5)/0.1)", units: {x: m, y: m}, dir: +x}}
observe: {a: "ay(p, x=1.5[m], t=0.1[s])"}
expect: {error: rejected, message: "where the acceleration is not defined"}
