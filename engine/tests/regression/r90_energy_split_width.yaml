# m8: energy split at a junction (r = -1/2: 1/4 reflected, 3/4 transmitted) and pulse widths (v2/v1 = 1/3)
media:
  L: {type: string, mu: 20 g/m, tension: 18 N}
  R: {type: string, mu: 180 g/m, tension: 18 N}
junctions: {J: {at: 0 m, left: L, right: R}}
waves:
  p: {pulse: {on: L, shape: "0.004*sin(pi*(x + 1.2)/0.6)*(step(x + 1.2) - step(x + 0.6))", units: {x: m, y: m}, dir: +x}}
observe:
  E_in: "energy(p)"
  E_r: "energy(p_reflected)"
  E_t: "energy(p_transmitted)"
  balance: "energy(p_reflected) + energy(p_transmitted) - energy(p)"
  W_t: "width(p_transmitted)"
  W_in: "width(p)"
  K_in: "kinetic_energy(p)"
  U_in: "potential_energy(p)"
expect: {balance: 0, E_r: "3*pi**2/50000", E_t: "9*pi**2/50000", W_t: "1/5", W_in: "3/5", K_in: "3*pi**2/25000", U_in: "3*pi**2/25000"}
