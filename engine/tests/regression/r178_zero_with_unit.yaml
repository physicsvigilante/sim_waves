# m14 (run 7 defect 3): a quoted zero with a unit is a position; "(0)[m]" and "-0[m]" too
media: {air: {type: gas, v: 330 m/s}}
sources:
  S: {on: air, at: ["0[m]", "(0)[m]"], f: 100 Hz, A: 1, phase: 0, spreading: none}
points:
  P: ["-0[m]", "5[m]"]
rays:
  r: {from: S, to: P}
observe: {L: "length(r)"}
expect: {L: 5}
