# m14 review round 7: arbitrary values are numbers when the engine evaluates, so they are allowed in a limit.
# A pipe open at both ends, v = 340 m/s (arbitrary), lengths L and L + dl: beat/dl -> v/(2 L^2); the ratio to
# v/(2 L^2) is 1 at every scaling
symbols: {dl: positive}
arbitrary: {L: 1 m}
media: {air: {type: gas, v: 340 m/s}}
resonators:
  p1: {type: pipe, on: air, length: L, ends: [open, open], end_correction: 0 m}
  p2: {type: pipe, on: air, length: L + dl, ends: [open, open], end_correction: 0 m}
observe:
  ratio: "limit(beat_frequency(frequency(p1, harmonic=1), frequency(p2, harmonic=1))/dl, dl, 0)/(340[m/s]/(2*L**2))"
expect: {ratio: 1}
