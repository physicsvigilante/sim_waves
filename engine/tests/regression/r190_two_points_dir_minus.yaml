# m14: as r189 for a wave toward -x: y = 8 sin(ph + k x) cm at t = 0; the bound picks
# ph + 0.10k = pi - asin(3/4), ph + 0.25k = 5pi/6: same k, ph = 10pi/9 - 5 asin(3/4)/3 = 2.0772
unknowns: {kk: positive, ph: phase}
media: {rope: {type: string, mu: 10 g/m, tension: 50 N}}
waves:
  w: {harmonic: {on: rope, A: 8 cm, k: kk, dir: -x, phase: ph}}
given:
  - {fact: "kk*15[cm] < 1", source: stated}
  - {fact: "y(w, x=10[cm], t=0[s]) == 6[cm]", source: stated}
  - {fact: "y(w, x=25[cm], t=0[s]) == 4[cm]", source: stated}
observe:
  k: "kk"
  phase: "ph"
expect: {k: "20*asin(3/4)/3 - 10*pi/9", phase: "10*pi/9 - 5*asin(3/4)/3"}
