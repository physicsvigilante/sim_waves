# m14 review round 2 (R2): when the compared value is provably free of the arbitrary values, nearest() is
# decided. Same wire, tension x4: the frequency ratio is exactly 2 for every mu and L, so option 2
arbitrary: {mu: 10 g/m, L: 1 m}
media:
  w1: {type: string, mu: mu, tension: 50 N}
  w2: {type: string, mu: mu, tension: 200 N}
resonators:
  r1: {type: string, on: w1, length: L, ends: [fixed, fixed]}
  r2: {type: string, on: w2, length: L, ends: [fixed, fixed]}
observe: {pick: "nearest(frequency(r2, harmonic=1)/frequency(r1, harmonic=1), 1, 2, 4)"}
expect: {pick: 2}
