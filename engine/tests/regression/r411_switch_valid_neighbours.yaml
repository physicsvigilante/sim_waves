# m15b round 2 R8 valid neighbours: off the switching point the slope of 0.01*abs(x)*(2*step(x)-1) is 0.01 on both sides, and the zero field's slope at 0.5 m is 0
media: {rope: {type: string, mu: 10 g/m, tension: 1 N}}
waves:
  p: {pulse: {on: rope, shape: "0.01*abs(x)*(2*step(x)-1)", units: {x: m, y: m}, dir: +x}}
  q: {pulse: {on: rope, shape: "0.01*x*step(x)*step(-x)", units: {x: m, y: m}, dir: +x}}
observe:
  s1: "slope(p, x=0.3[m], t=0[s])"
  s2: "slope(p, x=-0.3[m], t=0[s])"
  s3: "slope(q, x=0.5[m], t=0[s])"
expect: {s1: 0.01, s2: 0.01, s3: 0}
