# m9: two unknowns tied through two sound levels
# two unknowns through levels: level at 10 m is 80 dB and at 20 m is L2; also L2 - 6 = something
unknowns: {P: positive, d: positive}
media: {air: {type: gas, v: 340 m/s}}
sources: {S: {on: air, at: [0 m, 0 m], power: P, phase: random, spreading: spherical}}
points: {A: [10 m, 0 m], B: [d, 0 m]}
rays: {a: {from: S, to: A}, b: {from: S, to: B}}
given:
  - "sound_level(intensity(a)) == 80"
  - "sound_level(intensity(b)) == 60"
observe: {P: "P", d: "d"}
expect: {P: "pi/25", d: 100}
