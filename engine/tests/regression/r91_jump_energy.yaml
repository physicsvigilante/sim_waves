# m8 qualification: a rectangular pulse (a jump) has infinite stretching energy: refused
media: {s: {type: string, mu: 0.01 kg/m, tension: 4 N}}
waves:
  p: {pulse: {on: s, shape: "0.01*(step(x - 1) - step(x - 1.2))", units: {x: m, y: m}, dir: +x}}
observe: {E: "energy(p)"}
expect: {error: rejected, message: "jumps"}
