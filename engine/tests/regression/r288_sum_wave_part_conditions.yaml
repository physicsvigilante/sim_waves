# m14 review round 16 (R1): a sum keeps its parts' written conditions: the part log(x - t) - log(x - t) is 0 but
# undefined at x - t = -1, so the sum is refused there (before: exp(-1))
waves:
  cut: {given: "log(x-t) - log(x-t)", units: {x: m, t: s, y: m}}
  smooth: {given: "exp(-(x-t)**2)", units: {x: m, t: s, y: m}}
  total: {sum: [cut, smooth]}
observe: {bad: "y(total, x=-1[m], t=0[s])"}
expect: {error: rejected, message: "not defined at this point"}
